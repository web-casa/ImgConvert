[package]
name = "imgconvert"
version = "0.3.1"
description = "Local-first cross-platform batch image converter"
authors = ["ImgConvert"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[example]]
name = "replay_fuzz_corpus"
required-features = ["fuzzing"]

[features]
# Direct builds retain the in-app updater. Mac App Store builds explicitly turn
# this feature off, since Store updates are delivered by the App Store itself.
default = ["updater"]
updater = ["dep:tauri-plugin-updater"]
desktop-e2e = []
fuzzing = ["imgconvert-backend/fuzzing"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
imgconvert-core = { path = "../crates/imgconvert-core" }
imgconvert-platform = { path = "../crates/imgconvert-platform" }
imgconvert-backend = { path = "../crates/imgconvert-backend" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2"
tauri-plugin-os = "2.3.2"

