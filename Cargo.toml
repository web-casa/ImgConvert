# 工作区根只纳入可独立测试和发布的 imgconvert-core 纯 Rust 库。
# Tauri 应用与 fuzz harness 各自维护独立 Cargo workspace/lockfile，避免桌面系统依赖污染核心库检查。
[workspace]
resolver = "2"
members = ["crates/imgconvert-core", "crates/imgconvert-platform", "crates/imgconvert-backend"]
exclude = ["src-tauri", "fuzz"]

[patch.crates-io]
# Narrow file-list fixes; origin and patch notes are in vendor/arboard/IMGCONVERT_PATCHES.md.
arboard = { path = "vendor/arboard" }
