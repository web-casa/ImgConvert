name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform_checks:
        description: Run optional Windows CI checks.
        required: true
        default: false
        type: boolean
      fuzz_corpus:
        description: Run low-cost generated fuzz corpus replay on Ubuntu.
        required: true
        default: false
        type: boolean
      package_smoke:
        description: Run optional Linux package build/install smoke.
        required: true
        default: false
        type: boolean
      package_smoke_arm64:
        description: Include free public Linux arm64 runner in optional package smoke.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  NODE_VERSION: "24"
  CARGO_ABOUT_VERSION: "0.9.0"

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.4
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run quality:frontend

  rust-core:
    name: Rust Core
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          scripts/ci-install-apt-packages.sh \
            build-essential \
            cmake \
            meson \
            nasm \
            ninja-build
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -p imgconvert-core --all-targets -- -D warnings
      - run: cargo test -p imgconvert-core

  fuzz-corpus:
    name: Fuzz Corpus Replay
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.fuzz_corpus }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.4
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: |
          scripts/ci-install-apt-packages.sh \
            build-essential \
            cmake \
            meson \
            nasm \
            ninja-build
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fuzz:ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-corpus-replay-report
          if-no-files-found: error
          retention-days: 3
          path: target/fuzz-corpus/*.json

  tauri-backend:
    name: Tauri Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          scripts/ci-install-apt-packages.sh \
            build-essential \
            cmake \
            meson \
            nasm \
            ninja-build \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          components: rustfmt, clippy
      - run: cargo +1.96.0 fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo +1.96.0 clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo +1.96.0 test --manifest-path src-tauri/Cargo.toml

  tauri-backend-windows:
    name: Tauri Backend Windows HEIC
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.platform_checks) }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/test-external-codecs-ci.mjs

  security:
    name: Security And Licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.4
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:check
      - run: pnpm run ci:cost:check
      - run: pnpm run release:flatpak:verify
      - run: cargo install cargo-deny --version 0.19.9 --locked
      - run: cargo install cargo-audit --locked
      - run: cargo install cargo-about --version ${{ env.CARGO_ABOUT_VERSION }} --locked --features cli
      - run: pnpm run license:check
      # cargo-deny 0.19 keeps --config on `check`; running from src-tauri works with
      # both that pinned CI version and newer local cargo-deny releases.
      - run: cd src-tauri && cargo deny --manifest-path ../Cargo.toml check bans sources advisories
      - run: cd src-tauri && cargo deny check bans sources advisories
      - run: pnpm run audit:rust
      - run: pnpm audit --prod

  e2e:
    name: Web Preview E2E
    runs-on: ubuntu-24.04
    needs: frontend
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.4
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: xvfb-run -a pnpm run e2e

  tauri-build-smoke:
    name: Tauri Build Smoke (${{ matrix.arch }})
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.package_smoke) }}
    runs-on: ${{ matrix.runner }}
    needs:
      - frontend
      - rust-core
      - tauri-backend
      - security
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.package_smoke_arm64) && '[{"arch":"amd64","runner":"ubuntu-22.04"},{"arch":"arm64","runner":"ubuntu-22.04-arm"}]' || '[{"arch":"amd64","runner":"ubuntu-22.04"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          scripts/ci-install-apt-packages.sh \
            build-essential \
            cmake \
            meson \
            nasm \
            ninja-build \
            rpm \
            file \
            desktop-file-utils \
            appstream \
            squashfs-tools \
            xvfb \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.4
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:linux:debug
      - run: pnpm run release:linux:smoke:deb:debug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: imgconvert-linux-${{ matrix.arch }}-debug
          if-no-files-found: error
          retention-days: 3
          path: |
            src-tauri/target/debug/bundle/deb/*.deb
