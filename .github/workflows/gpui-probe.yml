# Migration plan §4 stage 2: builds the GPUI shell on the six desktop targets
# and proves each binary starts, presents frames and reports `ready` through
# the perf probe. Manual only; it is a feasibility probe, not a release job.
name: GPUI Probe

on:
  workflow_dispatch:
    inputs:
      updater_compatibility:
        description: Run the internal Linux updater SDK compatibility matrix instead of GUI probes.
        type: boolean
        default: false
      targets:
        description: Which targets to probe
        type: choice
        default: all
        options:
          - all
          - linux
          - macos
          - windows

concurrency:
  group: gpui-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  probe:
    if: ${{ !inputs.updater_compatibility }}
    name: GPUI Probe (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets == 'linux' && '[{"target":"linux-x86_64","runner":"ubuntu-24.04","os":"linux","target_dir":"apps/gpui/target","cache_target":"target"},{"target":"linux-aarch64","runner":"ubuntu-24.04-arm","os":"linux","target_dir":"apps/gpui/target","cache_target":"target"}]' || inputs.targets == 'macos' && '[{"target":"macos-arm64","runner":"macos-15","os":"macos","target_dir":"apps/gpui/target","cache_target":"target"},{"target":"macos-x64","runner":"macos-15-intel","os":"macos","target_dir":"apps/gpui/target","cache_target":"target"}]' || inputs.targets == 'windows' && '[{"target":"windows-x64","runner":"windows-latest","os":"windows","target_dir":"C:\\imgconvert-gpui-target","cache_target":"C:\\imgconvert-gpui-target"},{"target":"windows-arm64","runner":"windows-11-arm","os":"windows","target_dir":"C:\\imgconvert-gpui-target","cache_target":"C:\\imgconvert-gpui-target"}]' || '[{"target":"linux-x86_64","runner":"ubuntu-24.04","os":"linux","target_dir":"apps/gpui/target","cache_target":"target"},{"target":"linux-aarch64","runner":"ubuntu-24.04-arm","os":"linux","target_dir":"apps/gpui/target","cache_target":"target"},{"target":"macos-arm64","runner":"macos-15","os":"macos","target_dir":"apps/gpui/target","cache_target":"target"},{"target":"macos-x64","runner":"macos-15-intel","os":"macos","target_dir":"apps/gpui/target","cache_target":"target"},{"target":"windows-x64","runner":"windows-latest","os":"windows","target_dir":"C:\\imgconvert-gpui-target","cache_target":"C:\\imgconvert-gpui-target"},{"target":"windows-arm64","runner":"windows-11-arm","os":"windows","target_dir":"C:\\imgconvert-gpui-target","cache_target":"C:\\imgconvert-gpui-target"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux build and runtime dependencies
        if: matrix.os == 'linux'
        run: |
          scripts/ci-install-apt-packages.sh \
            build-essential \
            cmake \
            meson \
            nasm \
            ninja-build \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libfontconfig1-dev \
            libvulkan-dev \
            libssl-dev \
            mesa-vulkan-drivers \
            vulkan-tools \
            xvfb

      - name: Install macOS codec build tools
        if: matrix.os == 'macos'
        run: |
          brew install cmake meson ninja
          nasm_version="2.16.03"
          nasm_archive="$RUNNER_TEMP/nasm-$nasm_version-macosx.zip"
          nasm_root="$RUNNER_TEMP/imgconvert-nasm-$nasm_version"
          curl --fail --location --silent --show-error \
            "https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip" \
            --output "$nasm_archive"
          echo "0d29bcd8a5fc617333f4549c7c1f93d1866a4a0915c40359e0a8585bb1a5aa75  $nasm_archive" \
            | shasum -a 256 --check
          mkdir "$nasm_root"
          unzip -q "$nasm_archive" -d "$nasm_root"
          echo "$nasm_root/nasm-$nasm_version" >> "$GITHUB_PATH"

      # libdav1d-sys 0.7.1 passes --prefix=/, which Python 3.13 no longer treats as absolute on Windows.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: matrix.os == 'windows'
        with:
          python-version: "3.12.10"
          architecture: ${{ matrix.target == 'windows-arm64' && 'arm64' || 'x64' }}

      - name: Install Windows codec build tools
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          python -m pip install --disable-pip-version-check meson==1.10.1
          meson --version
          if ("${{ matrix.target }}" -eq "windows-x64") {
            # libaom 3.11 checks NASM help using a flag that changed in NASM 3.
            $nasmVersion = "2.16.03"
            $nasmArchive = Join-Path $env:RUNNER_TEMP "nasm-$nasmVersion-win64.zip"
            $nasmRoot = Join-Path $env:RUNNER_TEMP "imgconvert-nasm-$nasmVersion"
            Invoke-WebRequest -Uri "https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip" -OutFile $nasmArchive
            $actualHash = (Get-FileHash -Algorithm SHA256 $nasmArchive).Hash.ToLowerInvariant()
            $expectedHash = "3ee4782247bcb874378d02f7eab4e294a84d3d15f3f6ee2de2f47a46aa7226e6"
            if ($actualHash -ne $expectedHash) {
              throw "NASM archive checksum mismatch: expected $expectedHash, got $actualHash"
            }
            New-Item -ItemType Directory -Path $nasmRoot | Out-Null
            Expand-Archive -LiteralPath $nasmArchive -DestinationPath $nasmRoot
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $nasmRoot "nasm-$nasmVersion")
          }

      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0

      - name: Configure MSVC build environment
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $buildArch = "${{ matrix.target == 'windows-arm64' && 'arm64' || 'x64' }}"
          if ($buildArch -eq "arm64") {
            $msvcComponent = "Microsoft.VisualStudio.Component.VC.Tools.ARM64"
            $linkerRelativePath = "bin/Hostarm64/arm64/link.exe"
            $linkerEnvironment = "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER"
          } else {
            $msvcComponent = "Microsoft.VisualStudio.Component.VC.Tools.x86.x64"
            $linkerRelativePath = "bin/Hostx64/x64/link.exe"
            $linkerEnvironment = "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER"
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires $msvcComponent -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio Build Tools with $msvcComponent were not found"
          }
          $vsDevCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) {
            throw "VsDevCmd.bat was not found at $vsDevCmd"
          }
          $envNames = @(
            "DevEnvDir",
            "ExtensionSdkDir",
            "Framework40Version",
            "FrameworkDir",
            "FrameworkDIR64",
            "FrameworkVersion",
            "FrameworkVersion64",
            "INCLUDE",
            "LIB",
            "LIBPATH",
            "Path",
            "UCRTVersion",
            "UniversalCRTSdkDir",
            "VCIDEInstallDir",
            "VCINSTALLDIR",
            "VCToolsInstallDir",
            "VCToolsRedistDir",
            "VCToolsVersion",
            "VisualStudioVersion",
            "VSINSTALLDIR",
            "WindowsLibPath",
            "WindowsSdkBinPath",
            "WindowsSdkDir",
            "WindowsSDKLibVersion",
            "WindowsSDKVersion",
            "WindowsSdkVerBinPath"
          )
          cmd /c "`"$vsDevCmd`" -arch=$buildArch -host_arch=$buildArch && set" | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") {
              $name = $matches[1]
              $value = $matches[2]
              if ($name -and $envNames -contains $name) {
                Set-Item -Path "Env:$name" -Value $value
                if ($name -ieq "Path") {
                  $pathEntries = @()
                  $pathEntries += $value -split ";"
                  $pathEntries += $env:Path -split ";"
                  $seen = @{}
                  $sanitizedPath = $pathEntries |
                    Where-Object {
                      $_ -and
                      (Test-Path $_) -and
                      $_ -notlike "*\WindowsApps" -and
                      $_ -notlike "*\Git\usr\bin" -and
                      $_ -notlike "*\Git\mingw64\bin"
                    } |
                    ForEach-Object {
                      $resolvedPath = [System.IO.Path]::GetFullPath($_).TrimEnd("\")
                      $key = $resolvedPath.ToLowerInvariant()
                      if (-not $seen.ContainsKey($key)) {
                        $seen[$key] = $true
                        $resolvedPath
                      }
                    }
                  $env:Path = ($sanitizedPath -join ";")
                  Add-Content -Path $env:GITHUB_ENV -Value "Path=$env:Path"
                } else {
                  Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
                }
                if ($name -ieq "VCToolsInstallDir") {
                  $linker = Join-Path $value $linkerRelativePath
                  if (-not (Test-Path $linker)) {
                    throw "MSVC linker was not found at $linker"
                  }
                  Add-Content -Path $env:GITHUB_ENV -Value "$linkerEnvironment=$linker"
                  Set-Item -Path "Env:$linkerEnvironment" -Value $linker
                }
              }
            }
          }
          cl
          $linkerValue = (Get-Item -Path "Env:$linkerEnvironment").Value
          Write-Host "Using Rust MSVC linker: $linkerValue"

      - name: Select native codec compiler
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          if ("${{ matrix.target == 'windows-arm64' && 'arm64' || 'x64' }}" -eq "arm64") {
            $compilerVersion = & clang-cl --version
            if ($LASTEXITCODE -ne 0) {
              throw "The Windows ARM64 runner does not provide a working clang-cl compiler"
            }
            $compilerVersion | Write-Host
            $nativeTargetLine = $compilerVersion |
              Where-Object { $_ -match "^Target:\s*" } |
              Select-Object -First 1
            $nativeTarget = $nativeTargetLine -replace "^Target:\s*", ""
            if ($nativeTarget -notmatch "^aarch64-.*-windows-msvc$") {
              throw "Expected native Windows ARM64 clang-cl, got target $nativeTarget"
            }
            # clang-cl keeps MSVC-compatible flags while its integrated assembler handles
            # the AArch64 .S files used by rav1e and dav1d.
            $cc = "clang-cl"
            $cxx = "clang-cl"
            # mozjpeg-sys enables the MSVC bit-scan intrinsic without defining the
            # corresponding header probe that upstream CMake normally supplies. Use
            # Clang's -D spelling because other native crates invoke clang directly.
            $arm64CFlags = "-DHAVE_INTRIN_H=1"
            Add-Content -Path $env:GITHUB_ENV -Value "CFLAGS_aarch64_pc_windows_msvc=$arm64CFlags"
          } else {
            $cc = "cl"
            $cxx = "cl"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "CC=$cc"
          Add-Content -Path $env:GITHUB_ENV -Value "CXX=$cxx"
          Set-Item -Path Env:CC -Value $cc
          Set-Item -Path Env:CXX -Value $cxx
          Write-Host "Native codec compiler: CC=$cc CXX=$cxx"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: gpui-probe-${{ matrix.target }}
          workspaces: apps/gpui -> ${{ matrix.cache_target }}

      # Windows builds use a short target directory: meson names dav1d objects
      # after their full source path, which overflows MAX_PATH under apps/gpui/target.
      - name: Build the GPUI shell
        env:
          CARGO_TARGET_DIR: ${{ matrix.target_dir }}
        run: cargo build --release --locked --manifest-path apps/gpui/Cargo.toml -p imgconvert-gpui

      - name: Launch with the perf probe (Linux, Xvfb + lavapipe)
        if: matrix.os == 'linux'
        run: |
          binary="${{ matrix.target_dir }}/release/imgconvert-gpui"
          # Software Vulkan (lavapipe): point the loader at the one ICD file this
          # architecture ships; a list with a missing entry makes it give up.
          ls /usr/share/vulkan/icd.d/
          lvp=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          test -n "$lvp"
          export VK_ICD_FILENAMES="$lvp" VK_DRIVER_FILES="$lvp"
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          sleep 2
          vulkaninfo --summary 2>&1 | head -40 || true
          # Run the shell under our own supervision: wait for the probe to finish
          # or for 45 s, then stop it. A GPUI app does not exit on its own.
          IMGCONVERT_PERF_PROBE=1 "$binary" 2> probe.log &
          app_pid=$!
          for _ in $(seq 1 45); do
            if grep -q '"mark":"probe_done"' probe.log 2>/dev/null; then break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          kill "$app_pid" 2>/dev/null || true
          sleep 1
          kill -9 "$app_pid" 2>/dev/null || true
          kill "$xvfb_pid" 2>/dev/null || true
          cat probe.log
          grep -q '"mark":"ready"' probe.log

      - name: Launch with the perf probe (macOS)
        if: matrix.os == 'macos'
        run: |
          binary="${{ matrix.target_dir }}/release/imgconvert-gpui"
          file "$binary"
          nm -u "$binary" | grep -E '^_CGS|^_SLS' > private-symbols.txt || true
          otool -L "$binary" | grep -i PrivateFrameworks >> private-symbols.txt || true
          echo "private API hits: $(wc -l < private-symbols.txt)"
          IMGCONVERT_PERF_PROBE=1 "$binary" 2> probe.log &
          pid=$!
          sleep 30
          kill "$pid" || true
          cat probe.log
          grep -q '"mark":"ready"' probe.log
          test ! -s private-symbols.txt

      - name: Launch with the perf probe (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $binary = "${{ matrix.target_dir }}\release\imgconvert-gpui.exe"
          $env:IMGCONVERT_PERF_PROBE = "1"
          $process = Start-Process -FilePath $binary -RedirectStandardError probe.log -PassThru
          Start-Sleep -Seconds 30
          if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          Get-Content probe.log
          if (-not (Select-String -Path probe.log -Pattern '"mark":"ready"' -Quiet)) {
            throw "the GPUI shell never reported ready"
          }

      # upload-artifact only accepts files under the workspace; the Windows
      # target directory lives outside it, so stage everything first.
      - name: Collect probe artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p probe-artifacts
          for file in probe.log private-symbols.txt \
            "${{ matrix.target_dir }}/release/imgconvert-gpui" \
            "${{ matrix.target_dir }}/release/imgconvert-gpui.exe"; do
            [ -f "$file" ] && cp "$file" probe-artifacts/ || true
          done
          ls -la probe-artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: gpui-probe-${{ matrix.target }}
          path: probe-artifacts
          if-no-files-found: ignore
          retention-days: 14

  updater-compatibility:
    name: Updater SDK compatibility (${{ matrix.arch }})
    if: ${{ inputs.updater_compatibility }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          scripts/ci-install-apt-packages.sh \
            build-essential cmake meson nasm ninja-build libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            squashfs-tools patchelf libfuse2 file
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.4
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: updater-sdk-${{ matrix.arch }}
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Install pinned cargo-packager CLI
        run: cargo install cargo-packager --version 0.11.8 --locked -j 2
      - name: Native old and new updater signature/install/run smoke
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
          IMGCONVERT_UPDATER_SMOKE_REPORT: target/updater-compat/${{ matrix.arch }}.json
        run: node scripts/smoke-gpui-updater-compat.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: updater-sdk-compat-${{ matrix.arch }}
          path: target/updater-compat/${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14
