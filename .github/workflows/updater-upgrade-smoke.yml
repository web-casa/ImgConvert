name: Updater Upgrade Smoke

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: Old updater-enabled release tag to launch.
        required: true
        default: v0.1.0
        type: string
      to_tag:
        description: Expected latest updater version.
        required: true
        default: v0.1.1
        type: string

permissions:
  contents: read

concurrency:
  group: updater-upgrade-smoke-${{ inputs.from_tag }}-${{ inputs.to_tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  linux-x86_64:
    name: Linux x86_64 In-App Updater
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          scripts/ci-install-apt-packages.sh \
            xvfb \
            xdotool \
            imagemagick \
            libgtk-3-0 \
            libwebkit2gtk-4.1-0 \
            libayatana-appindicator3-1 \
            librsvg2-2 \
            libasound2t64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Real in-app updater smoke
        env:
          IMGCONVERT_UPDATER_REPOSITORY: ${{ github.repository }}
          IMGCONVERT_UPDATER_FROM_TAG: ${{ inputs.from_tag }}
          IMGCONVERT_UPDATER_TO_TAG: ${{ inputs.to_tag }}
        run: |
          node scripts/smoke-tauri-in-app-updater.mjs \
            --repo="$IMGCONVERT_UPDATER_REPOSITORY" \
            --from-tag="$IMGCONVERT_UPDATER_FROM_TAG" \
            --to-tag="$IMGCONVERT_UPDATER_TO_TAG" \
            --platform=linux-x86_64 \
            --require-gui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: updater-upgrade-smoke-${{ inputs.from_tag }}-${{ inputs.to_tag }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            target/updater-upgrade-smoke/*.png
