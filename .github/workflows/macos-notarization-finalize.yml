name: macOS Notarization Finalize
run-name: Finalize macOS notarization from run ${{ inputs.source_run_id }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful macOS submission workflow run ID containing the pending DMG.
        required: true
        type: string
      release_tag:
        description: Exact draft Release tag when the source run requested release attachment; otherwise leave empty.
        required: false
        default: ""
        type: string
      architecture:
        description: Architecture of the submitted DMG to finalize.
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x64

permissions:
  actions: read
  contents: write

concurrency:
  group: release-draft-${{ inputs.release_tag || inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Check and finalize macOS notarization
    runs-on: ${{ inputs.architecture == 'x64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 15
    steps:
      - name: Validate source workflow run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          IMGCONVERT_DMG_ARCH: ${{ inputs.architecture }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$SOURCE_RUN_ID" in
            ''|*[!0-9]*) echo "source_run_id must contain only digits"; exit 1 ;;
          esac
          if [ -n "$INPUT_RELEASE_TAG" ]; then
            [[ "$INPUT_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
              echo "release_tag must be a semantic v-prefixed tag"
              exit 1
            }
          fi

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          test "$(jq -r '.status' <<< "$run_json")" = "completed" || { echo "source run is not completed"; exit 1; }
          test "$(jq -r '.conclusion' <<< "$run_json")" = "success" || { echo "source run did not succeed"; exit 1; }
          test "$(jq -r '.event' <<< "$run_json")" = "workflow_dispatch" || { echo "source run was not manually dispatched"; exit 1; }
          test "$(jq -r '.head_repository.full_name' <<< "$run_json")" = "$GITHUB_REPOSITORY" || { echo "source repository mismatch"; exit 1; }

          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          test "$GITHUB_REF" = "refs/heads/$default_branch" || { echo "finalizer must run from the default branch"; exit 1; }
          test "$(jq -r '.head_branch' <<< "$run_json")" = "$default_branch" || { echo "source run must use the default branch"; exit 1; }

          head_sha="$(jq -r '.head_sha' <<< "$run_json")"
          workflow_name="$(jq -r '.name' <<< "$run_json")"
          workflow_id="$(jq -r '.workflow_id' <<< "$run_json")"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid source head SHA"; exit 1; }
          [[ "$workflow_id" =~ ^[0-9]+$ ]] || { echo "invalid source workflow ID"; exit 1; }

          workflow_path="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" --jq '.path')"
          case "$workflow_path" in
            .github/workflows/macos-smoke.yml)
              test "$workflow_name" = "macOS Smoke" || { echo "source workflow name mismatch"; exit 1; }
              test "$IMGCONVERT_DMG_ARCH" = "arm64" || { echo "macOS Smoke only produces an arm64 notarization artifact"; exit 1; }
              allow_release=false
              ;;
            .github/workflows/macos-release.yml)
              test "$workflow_name" = "macOS DMG Release" || { echo "source workflow name mismatch"; exit 1; }
              allow_release=true
              ;;
            *)
              echo "unsupported source workflow: $workflow_path"
              exit 1
              ;;
          esac

          {
            echo "head_sha=$head_sha"
            echo "workflow_name=$workflow_name"
            echo "allow_release=$allow_release"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Check notarization credentials
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          test -n "$APPLE_API_KEY" || { echo "APPLE_API_KEY secret is required for API notarization"; exit 1; }
          test -n "$APPLE_API_ISSUER" || { echo "APPLE_API_ISSUER secret is required for API notarization"; exit 1; }
          test -n "$APPLE_API_KEY_BASE64" || { echo "APPLE_API_KEY_BASE64 secret is required for API notarization"; exit 1; }

      - name: Prepare App Store Connect API key
        id: api_key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_BASE64" ]; then
            key_path="$RUNNER_TEMP/imgconvert-notary-api-key.p8"
            if ! printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path" 2>/dev/null; then
              printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
            fi
            test -s "$key_path" || { echo "decoded API key is empty"; exit 1; }
            echo "path=$key_path" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pending DMG and receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          IMGCONVERT_DMG_ARCH: ${{ inputs.architecture }}
        run: |
          artifact_dir="$GITHUB_WORKSPACE/src-tauri/target/release/bundle/dmg"
          mkdir -p "$artifact_dir"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "imgconvert-macos-${IMGCONVERT_DMG_ARCH}-dmg-pending" \
            --dir "$artifact_dir"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "imgconvert-macos-${IMGCONVERT_DMG_ARCH}-notarization-receipt" \
            --dir "$artifact_dir"

          dmgs=()
          while IFS= read -r -d '' file; do dmgs+=("$file"); done < <(find "$artifact_dir" -type f -name '*.dmg' -print0)
          receipts=()
          while IFS= read -r -d '' file; do receipts+=("$file"); done < <(find "$artifact_dir" -type f -name 'notarization.json' -print0)
          test "${#dmgs[@]}" -eq 1 || { echo "expected exactly one DMG, found ${#dmgs[@]}"; exit 1; }
          test "${#receipts[@]}" -eq 1 || { echo "expected exactly one receipt, found ${#receipts[@]}"; exit 1; }
          case "${dmgs[0]}${receipts[0]}" in *$'\n'*|*$'\r'*) echo "artifact path contains a newline"; exit 1 ;; esac
          {
            echo "IMGCONVERT_MACOS_DMG=${dmgs[0]}"
            echo "IMGCONVERT_NOTARY_RECEIPT=${receipts[0]}"
          } >> "$GITHUB_ENV"

      - name: Check Apple status and staple accepted DMG
        id: notarization
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.api_key.outputs.path }}
          IMGCONVERT_NOTARY_EXPECTED_REPOSITORY: ${{ github.repository }}
          IMGCONVERT_NOTARY_EXPECTED_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          IMGCONVERT_NOTARY_EXPECTED_WORKFLOW: ${{ steps.source.outputs.workflow_name }}
          IMGCONVERT_NOTARY_EXPECTED_WORKFLOW_SHA: ${{ steps.source.outputs.head_sha }}
          IMGCONVERT_NOTARY_ALLOW_RELEASE: ${{ steps.source.outputs.allow_release }}
          IMGCONVERT_DMG_ARCH: ${{ inputs.architecture }}
        run: |
          case "$IMGCONVERT_DMG_ARCH" in
            arm64) expected_architecture=arm64 ;;
            x64) expected_architecture=x86_64 ;;
            *) echo "unsupported DMG architecture: $IMGCONVERT_DMG_ARCH"; exit 1 ;;
          esac

          node scripts/notarize-macos-dmg.mjs \
            --profile=release \
            --finalize \
            --dmg="$IMGCONVERT_MACOS_DMG" \
            --receipt="$IMGCONVERT_NOTARY_RECEIPT" \
            --expected-architectures="$expected_architecture"

      - name: Report pending Apple status
        if: ${{ steps.notarization.outputs.notarization_status == 'In Progress' }}
        env:
          SUBMISSION_ID: ${{ steps.notarization.outputs.submission_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          {
            echo "Apple notarization is still in progress."
            echo "Submission: $SUBMISSION_ID"
            echo "Run this workflow again later with source_run_id=$SOURCE_RUN_ID."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ success() && steps.notarization.outputs.notarization_status == 'Accepted' }}
        with:
          name: imgconvert-macos-${{ inputs.architecture }}-dmg-notarized-${{ inputs.source_run_id }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ env.IMGCONVERT_MACOS_DMG }}

      - name: Verify release source and existing GitHub Release
        if: ${{ success() && steps.notarization.outputs.notarization_status == 'Accepted' && steps.notarization.outputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          IMGCONVERT_RELEASE_TAG: ${{ steps.notarization.outputs.release_tag }}
          IMGCONVERT_SOURCE_SHA: ${{ steps.notarization.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -n "$INPUT_RELEASE_TAG" || { echo "release_tag is required when attaching a DMG"; exit 1; }
          test "$INPUT_RELEASE_TAG" = "$IMGCONVERT_RELEASE_TAG" || { echo "release_tag does not match the notarization receipt"; exit 1; }
          tag_sha="$(git rev-parse "$IMGCONVERT_RELEASE_TAG^{commit}")"
          test "$tag_sha" = "$IMGCONVERT_SOURCE_SHA" || { echo "release tag does not match receipt source SHA"; exit 1; }
          release_json="$(gh release view "$IMGCONVERT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json id,isDraft,tagName)"
          test "$(jq -r '.tagName' <<< "$release_json")" = "$IMGCONVERT_RELEASE_TAG" || { echo "release tag mismatch"; exit 1; }
          test "$(jq -r '.isDraft' <<< "$release_json")" = "true" || {
            echo "refusing to attach a DMG to a non-draft GitHub Release"
            exit 1
          }

      - name: Normalize verified release DMG name
        if: ${{ success() && steps.notarization.outputs.notarization_status == 'Accepted' && steps.notarization.outputs.publish_release == 'true' }}
        env:
          IMGCONVERT_RELEASE_TAG: ${{ steps.notarization.outputs.release_tag }}
          IMGCONVERT_DMG_ARCH: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          canonical_dmg="$(dirname "$IMGCONVERT_MACOS_DMG")/ImgConvert_${IMGCONVERT_RELEASE_TAG#v}_${IMGCONVERT_DMG_ARCH}.dmg"
          if [ "$IMGCONVERT_MACOS_DMG" != "$canonical_dmg" ]; then
            test ! -e "$canonical_dmg" || { echo "canonical DMG path already exists"; exit 1; }
            mv -- "$IMGCONVERT_MACOS_DMG" "$canonical_dmg"
          fi
          echo "IMGCONVERT_MACOS_DMG=$canonical_dmg" >> "$GITHUB_ENV"

      - name: Install and run finalized DMG
        if: ${{ success() && steps.notarization.outputs.notarization_status == 'Accepted' && steps.notarization.outputs.publish_release == 'true' }}
        env:
          DMG_ARCHITECTURE: ${{ inputs.architecture }}
          RELEASE_TAG: ${{ steps.notarization.outputs.release_tag }}
        run: |
          set -euo pipefail
          node scripts/check-macos-bundle-artifacts.mjs --bundles=dmg \
            --artifact="$IMGCONVERT_MACOS_DMG" --require-signed --require-notarized \
            --expected-architectures="$DMG_ARCHITECTURE" --expected-version="${RELEASE_TAG#v}" --install-smoke
          mkdir macos-release-assets
          cp "$IMGCONVERT_MACOS_DMG" macos-release-assets/

      - name: Record final macos-${{ inputs.architecture }} release evidence
        if: ${{ success() && steps.notarization.outputs.notarization_status == 'Accepted' && steps.notarization.outputs.publish_release == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.notarization.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.notarization.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          extension_version="$(git show "$RELEASE_TAG:browser-extension/package.json" | jq -er '.version | strings')"
          node scripts/github-release-evidence.mjs --group=macos-${{ inputs.architecture }} \
            --assets-dir="macos-release-assets" --release-tag="$RELEASE_TAG" \
            --source-sha="$SOURCE_SHA" --extension-version="$extension_version" --output-dir=release-evidence
          cp "release-evidence/release-evidence-macos-${{ inputs.architecture }}.json" "macos-release-assets/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ success() && steps.notarization.outputs.notarization_status == 'Accepted' && steps.notarization.outputs.publish_release == 'true' }}
        with:
          name: imgconvert-release-evidence-macos-${{ inputs.architecture }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: release-evidence/release-evidence-macos-${{ inputs.architecture }}.json

      - name: Append verified macos-${{ inputs.architecture }} assets and checksums
        if: ${{ success() && steps.notarization.outputs.notarization_status == 'Accepted' && steps.notarization.outputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.notarization.outputs.release_tag }}
        shell: bash
        run: node scripts/append-github-release-assets.mjs --assets-dir="macos-release-assets" --release-tag="$RELEASE_TAG"
