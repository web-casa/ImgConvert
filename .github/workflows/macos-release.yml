name: macOS DMG Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag to build, for example v0.2.1.
        required: true
        type: string
      publish_release:
        description: Let the finalizer attach the verified DMG to an existing same-tag release.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-dmg-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  NODE_VERSION: "24"

jobs:
  macos-dmg-release:
    name: macOS DMG Release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            uname_arch: arm64
          - arch: x64
            runner: macos-15-intel
            uname_arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify release tag and source version
        env:
          IMGCONVERT_RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release-tag.mjs --tag="$IMGCONVERT_RELEASE_TAG"

      - name: Verify macOS runner architecture
        run: |
          echo "macOS version: $(sw_vers -productVersion)"
          echo "Runner architecture: $(uname -m)"
          if [ "$(uname -m)" != "${{ matrix.uname_arch }}" ]; then
            echo "macOS DMG Release (${{ matrix.arch }}) expects ${{ matrix.uname_arch }} runner, got $(uname -m)"
            exit 1
          fi

      - name: Check direct signing/notarization secrets
        env:
          APPLE_DIRECT_CERTIFICATE: ${{ secrets.APPLE_DIRECT_CERTIFICATE }}
          APPLE_DIRECT_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DIRECT_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_DIRECT_CERTIFICATE" || { echo "APPLE_DIRECT_CERTIFICATE secret is required"; exit 1; }
          test -n "$APPLE_DIRECT_CERTIFICATE_PASSWORD" || { echo "APPLE_DIRECT_CERTIFICATE_PASSWORD secret is required"; exit 1; }
          test -n "$KEYCHAIN_PASSWORD" || { echo "KEYCHAIN_PASSWORD secret is required"; exit 1; }
          if [ -n "$APPLE_API_KEY" ] || [ -n "$APPLE_API_ISSUER" ] || [ -n "$APPLE_API_KEY_BASE64" ]; then
            test -n "$APPLE_API_KEY" || { echo "APPLE_API_KEY secret is required with API notarization"; exit 1; }
            test -n "$APPLE_API_ISSUER" || { echo "APPLE_API_ISSUER secret is required with API notarization"; exit 1; }
            test -n "$APPLE_API_KEY_BASE64" || { echo "APPLE_API_KEY_BASE64 secret is required with API notarization"; exit 1; }
          else
            test -n "$APPLE_ID" || { echo "APPLE_ID secret is required without API notarization"; exit 1; }
            test -n "$APPLE_PASSWORD" || { echo "APPLE_PASSWORD secret is required without API notarization"; exit 1; }
            test -n "$APPLE_TEAM_ID" || { echo "APPLE_TEAM_ID secret is required without API notarization"; exit 1; }
          fi

      - name: Install native codec build tools
        run: |
          brew install cmake meson ninja
          if [ "${{ matrix.arch }}" = "x64" ]; then
            # libaom 3.11 checks NASM help using a flag that changed in NASM 3.
            nasm_version="2.16.03"
            nasm_archive="$RUNNER_TEMP/nasm-$nasm_version-macosx.zip"
            nasm_root="$RUNNER_TEMP/imgconvert-nasm-$nasm_version"
            curl --fail --location --silent --show-error \
              "https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip" \
              --output "$nasm_archive"
            echo "0d29bcd8a5fc617333f4549c7c1f93d1866a4a0915c40359e0a8585bb1a5aa75  $nasm_archive" \
              | shasum -a 256 -c -
            mkdir "$nasm_root"
            unzip -q "$nasm_archive" -d "$nasm_root"
            nasm_bin="$nasm_root/nasm-$nasm_version"
            echo "$nasm_bin" >> "$GITHUB_PATH"
            export PATH="$nasm_bin:$PATH"
            nasm -v
          fi

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.4
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          components: rustfmt, clippy

      - run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm run typecheck

      - name: macOS direct-release guardrails
        run: pnpm run release:macos:direct:check

      - name: Tauri backend macOS fmt
        run: cargo +1.96.0 fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Tauri backend macOS clippy
        run: cargo +1.96.0 clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tauri backend macOS tests
        run: cargo +1.96.0 test --manifest-path src-tauri/Cargo.toml

      - name: Import Apple direct signing certificate
        env:
          APPLE_DIRECT_CERTIFICATE: ${{ secrets.APPLE_DIRECT_CERTIFICATE }}
          APPLE_DIRECT_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DIRECT_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if ! printf '%s' "$APPLE_DIRECT_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/imgconvert-direct-signing.p12" 2>/dev/null; then
            printf '%s' "$APPLE_DIRECT_CERTIFICATE" | base64 -D > "$RUNNER_TEMP/imgconvert-direct-signing.p12"
          fi
          test -s "$RUNNER_TEMP/imgconvert-direct-signing.p12" || { echo "decoded direct certificate is empty"; exit 1; }
          security create-keychain -p "$KEYCHAIN_PASSWORD" imgconvert-build.keychain
          security default-keychain -s imgconvert-build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" imgconvert-build.keychain
          security set-keychain-settings -t 3600 -u imgconvert-build.keychain
          security import "$RUNNER_TEMP/imgconvert-direct-signing.p12" \
            -k imgconvert-build.keychain \
            -P "$APPLE_DIRECT_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" imgconvert-build.keychain
          security find-identity -v -p codesigning imgconvert-build.keychain

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_BASE64" ]; then
            key_path="$RUNNER_TEMP/imgconvert-notary-api-key.p8"
            if ! printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path" 2>/dev/null; then
              printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
            fi
            test -s "$key_path" || { echo "decoded API key is empty"; exit 1; }
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi

      - name: Select direct signing identity
        env:
          IMGCONVERT_DIRECT_SIGNING_IDENTITY: ${{ secrets.IMGCONVERT_DIRECT_SIGNING_IDENTITY }}
        run: |
          identity="$IMGCONVERT_DIRECT_SIGNING_IDENTITY"
          if [ -z "$identity" ]; then
            identity="$(security find-identity -v -p codesigning imgconvert-build.keychain | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          fi
          test -n "$identity" || { echo "Developer ID Application signing identity was not found"; exit 1; }
          echo "IMGCONVERT_DIRECT_EFFECTIVE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build signed direct DMG
        env:
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
        run: APPLE_SIGNING_IDENTITY="$IMGCONVERT_DIRECT_EFFECTIVE_SIGNING_IDENTITY" pnpm run release:macos

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: imgconvert-macos-${{ matrix.arch }}-dmg-pending
          if-no-files-found: error
          retention-days: 7
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Submit direct DMG for notarization
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IMGCONVERT_NOTARY_RELEASE_TAG: ${{ inputs.tag }}
          IMGCONVERT_NOTARY_PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          IMGCONVERT_NOTARY_SOURCE_SHA="$(git rev-parse HEAD)" \
            pnpm run release:macos:notarize -- \
              --submit-only \
              --receipt=src-tauri/target/release/bundle/dmg/notarization.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: imgconvert-macos-${{ matrix.arch }}-notarization-receipt
          if-no-files-found: error
          retention-days: 7
          path: src-tauri/target/release/bundle/dmg/notarization.json
