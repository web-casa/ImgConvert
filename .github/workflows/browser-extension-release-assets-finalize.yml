name: Browser Extension Release Assets Finalize
run-name: Attach browser extension ZIPs to ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag whose checked browser-extension ZIPs will be attached.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-draft-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Build, verify, and attach Chrome and Edge ZIPs to draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate release tag input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "release_tag must be a semantic v-prefixed tag"
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.4
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate immutable tag and draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          test "$GITHUB_REF" = "refs/heads/$default_branch" || { echo "finalizer must run from the default branch"; exit 1; }
          git fetch --force --tags origin
          tag_sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$tag_sha" "origin/$default_branch" || { echo "release tag is not on the default branch"; exit 1; }
          test "$(git show "$RELEASE_TAG:package.json" | jq -r '.version')" = "${RELEASE_TAG#v}" || { echo "release version mismatch"; exit 1; }
          git cat-file -e "$RELEASE_TAG:browser-extension/package.json" 2>/dev/null || { echo "release tag has no browser extension source"; exit 1; }
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName)"
          test "$(jq -r '.tagName' <<< "$release_json")" = "$RELEASE_TAG" || { echo "release tag mismatch"; exit 1; }
          test "$(jq -r '.isDraft' <<< "$release_json")" = "true" || { echo "refusing to attach extension assets to a non-draft Release"; exit 1; }
          git checkout --detach "$tag_sha"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run extension:check
      - run: pnpm run extension:zip

      - name: Stage checked browser-extension ZIPs
        shell: bash
        run: |
          set -euo pipefail
          extension_version="$(jq -er '.version | strings' browser-extension/package.json)"
          mkdir extension-release-assets
          cp "browser-extension/.output/imgconvert-chrome-mv3-$extension_version.zip" extension-release-assets/
          cp "browser-extension/.output/imgconvert-edge-mv3-$extension_version.zip" extension-release-assets/
          echo "EXTENSION_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record final extensions release evidence
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ env.EXTENSION_SOURCE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          extension_version="$(git show "$RELEASE_TAG:browser-extension/package.json" | jq -er '.version | strings')"
          node scripts/github-release-evidence.mjs --group=extensions \
            --assets-dir="extension-release-assets" --release-tag="$RELEASE_TAG" \
            --source-sha="$SOURCE_SHA" --extension-version="$extension_version" --output-dir=release-evidence
          cp "release-evidence/release-evidence-extensions.json" "extension-release-assets/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: imgconvert-release-evidence-extensions-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: release-evidence/release-evidence-extensions.json

      - name: Append verified extensions assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: node scripts/append-github-release-assets.mjs --assets-dir="extension-release-assets" --release-tag="$RELEASE_TAG"
