name: Windows Smoke

on:
  workflow_dispatch:
    inputs:
      build_direct:
        description: Build unsigned Windows direct installers.
        required: true
        default: false
        type: boolean
      install_smoke:
        description: Install built direct installers and run hidden package smoke.
        required: true
        default: false
        type: boolean
      store_msix:
        description: Build the Store MSIX package and run sideload install smoke.
        required: true
        default: false
        type: boolean
      bundles:
        description: Direct installer bundles for the manual smoke build.
        required: true
        default: "msi,nsis"
        type: choice
        options:
          - msi,nsis
          - msi
          - nsis
      architecture:
        description: Native architecture to validate.
        required: true
        default: both
        type: choice
        options:
          - both
          - x64
          - arm64

permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.ref }}-${{ inputs.architecture }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  NODE_VERSION: "24"
  RUSTUP_HOME: C:\rustup
  CARGO_HOME: C:\cargo
  CARGO_TARGET_DIR: C:\imgconvert-target
  CC: cl
  CXX: cl

jobs:
  windows-smoke:
    name: Windows Smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.architecture == 'x64' && '[{"arch":"x64","runner":"windows-latest"}]' || inputs.architecture == 'arm64' && '[{"arch":"arm64","runner":"windows-11-arm"}]' || '[{"arch":"x64","runner":"windows-latest"},{"arch":"arm64","runner":"windows-11-arm"}]') }}
    env:
      WINDOWS_STORE_PROCESSOR_ARCHITECTURE: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Windows runner architecture
        shell: pwsh
        run: |
          $expected = if ("${{ matrix.arch }}" -eq "arm64") { "ARM64" } else { "AMD64" }
          if ($env:PROCESSOR_ARCHITECTURE -ne $expected) {
            throw "Windows Smoke (${{ matrix.arch }}) expects $expected runner, got $env:PROCESSOR_ARCHITECTURE"
          }

      # libdav1d-sys 0.7.1 passes --prefix=/, which Python 3.13 no longer treats as absolute on Windows.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
          architecture: ${{ matrix.arch }}

      - name: Install native codec build tools
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          python -m pip install --disable-pip-version-check meson==1.10.1
          meson --version
          if ("${{ matrix.arch }}" -eq "x64") {
            # libaom 3.11 checks NASM help using a flag that changed in NASM 3.
            $nasmVersion = "2.16.03"
            $nasmArchive = Join-Path $env:RUNNER_TEMP "nasm-$nasmVersion-win64.zip"
            $nasmRoot = Join-Path $env:RUNNER_TEMP "imgconvert-nasm-$nasmVersion"
            Invoke-WebRequest -Uri "https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip" -OutFile $nasmArchive
            $actualHash = (Get-FileHash -Algorithm SHA256 $nasmArchive).Hash.ToLowerInvariant()
            $expectedHash = "3ee4782247bcb874378d02f7eab4e294a84d3d15f3f6ee2de2f47a46aa7226e6"
            if ($actualHash -ne $expectedHash) {
              throw "NASM archive checksum mismatch: expected $expectedHash, got $actualHash"
            }
            New-Item -ItemType Directory -Path $nasmRoot | Out-Null
            Expand-Archive -LiteralPath $nasmArchive -DestinationPath $nasmRoot
            $nasmBin = Join-Path $nasmRoot "nasm-$nasmVersion"
            Add-Content -Path $env:GITHUB_PATH -Value $nasmBin
            $env:Path = "$nasmBin;$env:Path"
            nasm -v
          }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.4
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          components: rustfmt, clippy

      - name: Verify native Rust target
        shell: pwsh
        run: |
          $expected = if ("${{ matrix.arch }}" -eq "arm64") { "aarch64-pc-windows-msvc" } else { "x86_64-pc-windows-msvc" }
          $installed = rustup target list --installed
          if ($installed -notcontains $expected) {
            throw "Windows Smoke (${{ matrix.arch }}) requires Rust target $expected; installed: $($installed -join ', ')"
          }

      - name: Configure MSVC build environment
        shell: pwsh
        run: |
          $buildArch = "${{ matrix.arch }}"
          if ($buildArch -eq "arm64") {
            $msvcComponent = "Microsoft.VisualStudio.Component.VC.Tools.ARM64"
            $linkerRelativePath = "bin/Hostarm64/arm64/link.exe"
            $linkerEnvironment = "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER"
          } else {
            $msvcComponent = "Microsoft.VisualStudio.Component.VC.Tools.x86.x64"
            $linkerRelativePath = "bin/Hostx64/x64/link.exe"
            $linkerEnvironment = "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER"
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires $msvcComponent -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio Build Tools with $msvcComponent were not found"
          }
          $vsDevCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) {
            throw "VsDevCmd.bat was not found at $vsDevCmd"
          }
          $envNames = @(
            "DevEnvDir",
            "ExtensionSdkDir",
            "Framework40Version",
            "FrameworkDir",
            "FrameworkDIR64",
            "FrameworkVersion",
            "FrameworkVersion64",
            "INCLUDE",
            "LIB",
            "LIBPATH",
            "Path",
            "UCRTVersion",
            "UniversalCRTSdkDir",
            "VCIDEInstallDir",
            "VCINSTALLDIR",
            "VCToolsInstallDir",
            "VCToolsRedistDir",
            "VCToolsVersion",
            "VisualStudioVersion",
            "VSINSTALLDIR",
            "WindowsLibPath",
            "WindowsSdkBinPath",
            "WindowsSdkDir",
            "WindowsSDKLibVersion",
            "WindowsSDKVersion",
            "WindowsSdkVerBinPath"
          )
          cmd /c "`"$vsDevCmd`" -arch=$buildArch -host_arch=$buildArch && set" | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") {
              $name = $matches[1]
              $value = $matches[2]
              if ($name -and $envNames -contains $name) {
                Set-Item -Path "Env:$name" -Value $value
                if ($name -ieq "Path") {
                  $pathEntries = @()
                  $pathEntries += $value -split ";"
                  $pathEntries += $env:Path -split ";"
                  $seen = @{}
                  $sanitizedPath = $pathEntries |
                    Where-Object {
                      $_ -and
                      (Test-Path $_) -and
                      $_ -notlike "*\WindowsApps" -and
                      $_ -notlike "*\Git\usr\bin" -and
                      $_ -notlike "*\Git\mingw64\bin"
                    } |
                    ForEach-Object {
                      $resolvedPath = [System.IO.Path]::GetFullPath($_).TrimEnd("\")
                      $key = $resolvedPath.ToLowerInvariant()
                      if (-not $seen.ContainsKey($key)) {
                        $seen[$key] = $true
                        $resolvedPath
                      }
                    }
                  $env:Path = ($sanitizedPath -join ";")
                  Add-Content -Path $env:GITHUB_ENV -Value "Path=$env:Path"
                } else {
                  Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
                }
                if ($name -ieq "VCToolsInstallDir") {
                  $linker = Join-Path $value $linkerRelativePath
                  if (-not (Test-Path $linker)) {
                    throw "MSVC linker was not found at $linker"
                  }
                  Add-Content -Path $env:GITHUB_ENV -Value "$linkerEnvironment=$linker"
                  Set-Item -Path "Env:$linkerEnvironment" -Value $linker
                }
              }
            }
          }
          cl
          $linkerValue = (Get-Item -Path "Env:$linkerEnvironment").Value
          Write-Host "Using Rust MSVC linker: $linkerValue"

      - name: Select native codec compiler
        shell: pwsh
        run: |
          if ("${{ matrix.arch }}" -eq "arm64") {
            $compilerVersion = & clang-cl --version
            if ($LASTEXITCODE -ne 0) {
              throw "The Windows ARM64 runner does not provide a working clang-cl compiler"
            }
            $compilerVersion | Write-Host
            $nativeTargetLine = $compilerVersion |
              Where-Object { $_ -match "^Target:\s*" } |
              Select-Object -First 1
            $nativeTarget = $nativeTargetLine -replace "^Target:\s*", ""
            if ($nativeTarget -notmatch "^aarch64-.*-windows-msvc$") {
              throw "Expected native Windows ARM64 clang-cl, got target $nativeTarget"
            }
            # clang-cl keeps MSVC-compatible flags while its integrated assembler handles
            # the AArch64 .S files used by rav1e and dav1d.
            $cc = "clang-cl"
            $cxx = "clang-cl"
            # mozjpeg-sys enables the MSVC bit-scan intrinsic without defining the
            # corresponding header probe that upstream CMake normally supplies. Use
            # Clang's -D spelling because other native crates invoke clang directly.
            $arm64CFlags = "-DHAVE_INTRIN_H=1"
            Add-Content -Path $env:GITHUB_ENV -Value "CFLAGS_aarch64_pc_windows_msvc=$arm64CFlags"
          } else {
            $cc = "cl"
            $cxx = "cl"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "CC=$cc"
          Add-Content -Path $env:GITHUB_ENV -Value "CXX=$cxx"
          Set-Item -Path Env:CC -Value $cc
          Set-Item -Path Env:CXX -Value $cxx
          Write-Host "Native codec compiler: CC=$cc CXX=$cxx"

      - run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm run typecheck

      - name: Windows release guardrails
        run: pnpm run release:windows:check

      - name: Tauri backend Windows fmt
        run: cargo +1.96.0 fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Tauri backend Windows clippy
        run: cargo +1.96.0 clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tauri backend Windows tests
        run: cargo +1.96.0 test --manifest-path src-tauri/Cargo.toml

      - name: Windows runtime smoke
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_direct }}
        run: pnpm run release:windows:smoke

      - name: Windows runtime smoke with direct installer build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_direct }}
        env:
          SMOKE_BUNDLES: ${{ inputs.bundles }}
          SMOKE_INSTALL_SMOKE: ${{ inputs.install_smoke }}
        shell: pwsh
        run: |
          $allowedBundles = @("msi,nsis", "msi", "nsis")
          if ($env:SMOKE_BUNDLES -notin $allowedBundles) {
            throw "Unsupported direct installer bundle selection: $env:SMOKE_BUNDLES"
          }
          $smokeArgs = @("--build-direct", "--bundles=$env:SMOKE_BUNDLES")
          if ($env:SMOKE_INSTALL_SMOKE -eq "true") {
            $smokeArgs += "--install-smoke"
          }
          pnpm run release:windows:smoke -- @smokeArgs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_direct }}
        with:
          name: imgconvert-windows-${{ matrix.arch }}-installers
          if-no-files-found: error
          retention-days: 3
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/msi/*.msi
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.exe

      - name: Windows Store MSIX package and install smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.store_msix }}
        env:
          IMGCONVERT_DISABLE_EXTERNAL_CODECS: "1"
          IMGCONVERT_DISABLE_UPDATER: "1"
          WINDOWS_STORE_IDENTITY_NAME: ImgConvert.DevSmoke
          WINDOWS_STORE_PUBLISHER: CN=ImgConvertDevSmoke
          WINDOWS_STORE_PUBLISHER_DISPLAY_NAME: ImgConvert Dev Smoke
          WINDOWS_STORE_VERSION: 1.0.0.0
        run: |
          pnpm run release:windows:msix
          pnpm run release:windows:msix:smoke -- --export-signed-dir=src-tauri/target/windows-msix/devsmoke

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.store_msix }}
        with:
          name: imgconvert-windows-${{ matrix.arch }}-msix-devsmoke
          if-no-files-found: error
          retention-days: 3
          path: src-tauri/target/windows-msix/devsmoke/*
