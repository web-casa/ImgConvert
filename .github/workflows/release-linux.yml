name: Linux Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      docker_smoke:
        description: Run Docker install/runtime smoke matrix after building packages.
        required: true
        default: false
        type: boolean
      build_arm64:
        description: Include free public Linux arm64 runner in release build.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  NODE_VERSION: "24"

jobs:
  linux-release:
    name: Linux Release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.build_arm64) && '[{"arch":"amd64","runner":"ubuntu-22.04"},{"arch":"arm64","runner":"ubuntu-22.04-arm"}]' || '[{"arch":"amd64","runner":"ubuntu-22.04"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify pushed release tag and source version
        if: ${{ github.event_name == 'push' }}
        env:
          IMGCONVERT_RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-tag.mjs --tag="$IMGCONVERT_RELEASE_TAG"
      - run: |
          scripts/ci-install-apt-packages.sh \
            build-essential \
            cmake \
            meson \
            nasm \
            ninja-build \
            rpm \
            rpm2cpio \
            cpio \
            binutils \
            file \
            desktop-file-utils \
            appstream \
            squashfs-tools \
            xdg-utils \
            xvfb \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
      - name: Verify native Rust target
        run: |
          expected="x86_64-unknown-linux-gnu"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            expected="aarch64-unknown-linux-gnu"
          fi
          rustup target list --installed | grep -Fx "$expected"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:linux
      - run: pnpm run release:linux:smoke:deb -- --convert-smoke
      - run: pnpm run release:linux:smoke:docker
        if: github.event_name != 'workflow_dispatch' || inputs.docker_smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: imgconvert-linux-${{ matrix.arch }}-release
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/SHA256SUMS
