name: Updater Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag to build and publish, for example v0.2.1.
        required: true
        type: string
      publish_release:
        description: Upload updater assets to the GitHub Release.
        required: true
        default: false
        type: boolean
      draft_release:
        description: Create the GitHub Release as draft when publishing.
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark the GitHub Release as prerelease when publishing.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: updater-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  NODE_VERSION: "24"

jobs:
  linux-updater:
    name: Linux AppImage Updater
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and source version
        env:
          IMGCONVERT_RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release-tag.mjs --tag="$IMGCONVERT_RELEASE_TAG"
      - run: |
          scripts/ci-install-apt-packages.sh \
            build-essential \
            cmake \
            meson \
            nasm \
            ninja-build \
            file \
            desktop-file-utils \
            appstream \
            squashfs-tools \
            xdg-utils \
            xvfb \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:platform:check
      - name: Build signed updater AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_ENDPOINTS: '["https://github.com/${{ github.repository }}/releases/latest/download/latest.json"]'
        run: pnpm run release:linux:updater
      - name: Cryptographically verify updater signatures
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: pnpm run release:updater:signature:verify
      - name: Generate latest.json
        env:
          TAURI_UPDATER_ARTIFACT_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}
        run: pnpm run release:updater:manifest
      - name: Verify latest.json
        env:
          TAURI_UPDATER_ARTIFACT_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}
        run: pnpm run release:updater:verify
      - name: Prepare AppImageHub canonical asset
        run: pnpm run release:appimagehub:prepare
      - name: Prepare AUR imgconvert-bin sources
        run: pnpm run release:aur:prepare
      - name: Verify AUR metadata with Arch makepkg
        run: pnpm run release:aur:verify:docker
      - name: Updater AppImage runtime smoke
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          IMGCONVERT_PACKAGE_CONVERT_SMOKE: "1"
        run: |
          appimage="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          test -n "$appimage"
          chmod +x "$appimage"
          "$appimage"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: imgconvert-updater-linux-${{ inputs.tag }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: |
            target/updater/latest.json
            target/appimagehub/*.AppImage
            target/appimagehub/*.AppImage.sig
            target/appimagehub/SHA256SUMS
            target/aur/imgconvert-bin
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/SHA256SUMS

  publish-release:
    name: Publish GitHub Release assets
    if: ${{ inputs.publish_release }}
    needs: linux-updater
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: imgconvert-updater-linux-${{ inputs.tag }}
          path: release-assets
      - name: Verify and stage release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          required=(
            'target/updater/latest.json'
            'target/appimagehub/*.AppImage'
            'target/appimagehub/*.AppImage.sig'
            'target/appimagehub/SHA256SUMS'
            'src-tauri/target/release/bundle/appimage/*.AppImage'
            'src-tauri/target/release/bundle/appimage/*.AppImage.sig'
            'src-tauri/target/release/bundle/SHA256SUMS'
          )
          publishable=()
          for pattern in "${required[@]}"; do
            matches=()
            mapfile -t matches < <(compgen -G "release-assets/$pattern" || true)
            if [ "${#matches[@]}" -ne 1 ] || [ ! -s "${matches[0]}" ]; then
              echo "Expected exactly one non-empty release asset for $pattern" >&2
              exit 1
            fi
            if [ "${pattern##*/}" != "SHA256SUMS" ]; then
              publishable+=("${matches[0]}")
            fi
          done
          for checksum in \
            release-assets/target/appimagehub/SHA256SUMS \
            release-assets/src-tauri/target/release/bundle/SHA256SUMS; do
            (
              cd "$(dirname "$checksum")"
              sha256sum --check --strict "$(basename "$checksum")"
            )
          done

          release_dir='release-publish-assets'
          mkdir "$release_dir"
          for source in "${publishable[@]}"; do
            asset_name="$(basename "$source")"
            destination="$release_dir/$asset_name"
            if [ -e "$destination" ]; then
              echo "Release asset basename collision: $asset_name" >&2
              exit 1
            fi
            cp "$source" "$destination"
          done

          python3 - "$RELEASE_TAG" "$RELEASE_REPOSITORY" "$release_dir/latest.json" "$release_dir" <<'PY'
          import json
          from pathlib import Path
          from sys import argv
          from urllib.parse import quote, unquote, urlparse

          tag, repository, manifest_path, release_dir = argv[1:]
          expected_version = tag.removeprefix("v")
          manifest = json.loads(Path(manifest_path).read_text(encoding="utf-8"))
          if manifest.get("version") != expected_version:
              raise SystemExit(
                  f"latest.json version {manifest.get('version')!r} does not match {expected_version!r}"
              )
          platform = manifest.get("platforms", {}).get("linux-x86_64")
          if not isinstance(platform, dict):
              raise SystemExit("latest.json is missing the linux-x86_64 updater platform")
          updater_url = urlparse(str(platform.get("url", "")))
          artifact_name = unquote(updater_url.path.rsplit("/", 1)[-1])
          if not artifact_name or Path(artifact_name).name != artifact_name:
            raise SystemExit("latest.json updater URL does not name a safe release asset")
          expected_path = f"/{repository}/releases/download/{tag}/{quote(artifact_name, safe='')}"
          if (
              updater_url.scheme != "https"
              or updater_url.netloc != "github.com"
              or updater_url.path != expected_path
              or updater_url.params
              or updater_url.query
              or updater_url.fragment
          ):
              raise SystemExit("latest.json updater URL does not match this release")
          artifact = Path(release_dir, artifact_name)
          signature = Path(f"{artifact}.sig")
          if not artifact.is_file() or not signature.is_file():
              raise SystemExit(f"latest.json updater asset or signature is missing: {artifact_name}")
          if signature.read_text(encoding="utf-8").strip() != str(platform.get("signature", "")).strip():
              raise SystemExit(f"latest.json signature does not match {signature.name}")
          Path(release_dir, "updater-artifact.txt").write_text(f"{artifact_name}\n", encoding="utf-8")
          PY

          (
            cd "$release_dir"
            sha256sum -- latest.json *.AppImage *.AppImage.sig > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
      - name: Re-verify staged updater signature
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        shell: bash
        run: |
          set -euo pipefail
          read -r artifact_name < release-publish-assets/updater-artifact.txt
          case "$artifact_name" in
            *.AppImage) ;;
            *) echo "Invalid staged updater artifact name: $artifact_name" >&2; exit 1 ;;
          esac
          verifier_dir='release-updater-verification'
          mkdir -p "$verifier_dir"
          cp "release-publish-assets/$artifact_name" "$verifier_dir/$artifact_name"
          cp "release-publish-assets/$artifact_name.sig" "$verifier_dir/$artifact_name.sig"
          cargo +1.96.0 run --locked --quiet \
            --manifest-path tools/updater-signature-verifier/Cargo.toml \
            -- --bundle-root="$verifier_dir"
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ inputs.tag }}
          draft: ${{ inputs.draft_release }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            release-publish-assets/latest.json
            release-publish-assets/*.AppImage
            release-publish-assets/*.AppImage.sig
            release-publish-assets/SHA256SUMS
      - name: Refresh merged GitHub Release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          checksum_assets='release-checksum-assets'
          mkdir -p "$checksum_assets"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$checksum_assets"
          node scripts/refresh-github-release-checksums.mjs --assets-dir="$checksum_assets"
          node scripts/refresh-github-release-checksums.mjs --assets-dir="$checksum_assets" --verify
          gh release upload "$RELEASE_TAG" "$checksum_assets/SHA256SUMS" --clobber --repo "$GITHUB_REPOSITORY"
