name: GPUI macOS GUI smoke

# Launches the real, windowed GPUI app on a hosted macOS runner (G3-4 of the
# migration plan): the app bundle opens its window, and the built-in probe
# (IMGCONVERT_PERF_PROBE_IMPORT / _BATCH_OUT) imports a fixture folder and
# runs a batch through the app's batch service and models; the window and
# the outputs are checked. Scope: the probe starts the batch through the
# no-prompt test entry point, so the Start button, the folder picker and the
# output-safety prompts are not exercised here (they have headless UI tests
# and native VoiceOver runs). Nothing is signed or published.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to test (empty tests the dispatched commit).
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: gpui-macos-gui-smoke-${{ inputs.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  gui-smoke:
    name: GPUI macOS GUI smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            uname_arch: arm64
          - arch: x64
            runner: macos-15-intel
            uname_arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Verify macOS runner architecture
        run: |
          actual="$(uname -m)"
          test "$actual" = "${{ matrix.uname_arch }}" || { echo "expected ${{ matrix.uname_arch }}, got $actual"; exit 1; }

      - name: Install native codec build tools
        run: |
          brew install cmake meson ninja
          if [ "${{ matrix.arch }}" = "x64" ]; then
            # libaom 3.11 checks NASM help using a flag that changed in NASM 3.
            nasm_version="2.16.03"
            nasm_archive="$RUNNER_TEMP/nasm-$nasm_version-macosx.zip"
            nasm_root="$RUNNER_TEMP/imgconvert-nasm-$nasm_version"
            curl --fail --location --silent --show-error \
              "https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip" \
              --output "$nasm_archive"
            echo "0d29bcd8a5fc617333f4549c7c1f93d1866a4a0915c40359e0a8585bb1a5aa75  $nasm_archive" \
              | shasum -a 256 -c -
            mkdir "$nasm_root"
            unzip -q "$nasm_archive" -d "$nasm_root"
            nasm_bin="$nasm_root/nasm-$nasm_version"
            echo "$nasm_bin" >> "$GITHUB_PATH"
            export PATH="$nasm_bin:$PATH"
            nasm -v
          fi

      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0

      - name: Build and package the GPUI app
        run: |
          cargo build --manifest-path apps/gpui/Cargo.toml --release --locked -p imgconvert-gpui
          mkdir -p dist
          scripts/package-gpui-macos.sh apps/gpui/target/release/imgconvert-gpui dist -

      - name: Prepare fixtures
        run: |
          fixtures=apps/gpui/crates/shell/tests/fixtures
          rm -rf "$RUNNER_TEMP/smoke"
          mkdir -p "$RUNNER_TEMP/smoke/in" "$RUNNER_TEMP/smoke/out" "$RUNNER_TEMP/smoke/home"
          cp "$fixtures/precision16.png" "$fixtures/pages3.pdf" "$RUNNER_TEMP/smoke/in/"
          sips -s format jpeg "$fixtures/precision16.png" --out "$RUNNER_TEMP/smoke/in/precision16-copy.jpg" >/dev/null
          ls -la "$RUNNER_TEMP/smoke/in"

      - name: Launch the app, import and convert
        run: |
          smoke="$RUNNER_TEMP/smoke"
          log="$smoke/app.log"
          app="$PWD/dist/ImgConvert.app"
          cleanup() {
            for pid in $(pgrep -f "$app/Contents/MacOS/imgconvert" || true); do
              kill "$pid" 2>/dev/null || true
              sleep 2
              kill -9 "$pid" 2>/dev/null || true
            done
          }
          trap cleanup EXIT
          open -n --stderr "$log" \
            --env HOME="$smoke/home" \
            --env IMGCONVERT_PERF_PROBE=1 \
            --env IMGCONVERT_PERF_PROBE_IMPORT="$smoke/in" \
            --env IMGCONVERT_PERF_PROBE_BATCH_OUT="$smoke/out" \
            --env IMGCONVERT_PERF_PROBE_BATCH_FORMAT=avif \
            "$app"
          pid=""
          for _ in $(seq 1 60); do
            pid="$(pgrep -f "$app/Contents/MacOS/imgconvert" | head -1 || true)"
            [ -n "$pid" ] && break
            sleep 1
          done
          test -n "$pid" || { echo "the app did not start"; exit 1; }
          echo "app pid: $pid"
          # The probe's own import and quiescence budgets are 10 and 5 minutes.
          for _ in $(seq 1 960); do
            grep -qE '"mark":"(batch_(done|failed|cancelled)|probe_error[a-z_]*)"' "$log" 2>/dev/null && break
            kill -0 "$pid" 2>/dev/null || { echo "the app exited early"; break; }
            sleep 1
          done
          # Let the final model update after batch_done render.
          sleep 3
          # The app's own window, seen by the window server (no accessibility
          # consent needed): owned by this PID, normal layer, real size.
          APP_PID="$pid" osascript -l JavaScript -e '
            ObjC.import("CoreGraphics");
            const pid = Number($.NSProcessInfo.processInfo.environment.objectForKey("APP_PID").js);
            const list = ObjC.deepUnwrap(ObjC.castRefToObject($.CGWindowListCopyWindowInfo($.kCGWindowListOptionOnScreenOnly, 0)));
            const own = list.filter(w => w.kCGWindowOwnerPID === pid && w.kCGWindowLayer === 0
              && w.kCGWindowBounds.Width >= 600 && w.kCGWindowBounds.Height >= 400);
            own.map(w => `${Math.round(w.kCGWindowBounds.Width)}x${Math.round(w.kCGWindowBounds.Height)}`).join("\n") || "no window";
          ' | tee "$smoke/windows.txt"
          screencapture -x "$smoke/screen.png" || echo "screenshot unavailable on this runner"
          cleanup
          grep -o '"mark":"[a-z_]*"[^}]*' "$log" | tee "$smoke/marks.txt"
          if grep -qE '"mark":"(batch_failed|batch_cancelled|probe_error[a-z_]*)"' "$log"; then
            echo "the probe reported a failure"; exit 1
          fi
          for mark in ready import_done probe_done batch_start batch_done; do
            grep -q "\"mark\":\"$mark\"" "$log" || { echo "missing mark $mark"; exit 1; }
          done
          ! grep -qx 'no window' "$smoke/windows.txt" || { echo "no app window was on screen"; exit 1; }
          ls -la "$smoke/out"
          # Exactly the expected outputs, each non-empty: two images and the
          # three pages of pages3.pdf.
          expected="pages3_done-page-001.avif pages3_done-page-002.avif pages3_done-page-003.avif precision16-copy_done.avif precision16_done.avif"
          actual="$(cd "$smoke/out" && ls | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')"
          test "$actual" = "$expected" || { echo "unexpected outputs: $actual"; exit 1; }
          for file in "$smoke"/out/*; do test -s "$file" || { echo "empty output $file"; exit 1; }; done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: gpui-macos-gui-smoke-${{ matrix.uname_arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/smoke/app.log
            ${{ runner.temp }}/smoke/marks.txt
            ${{ runner.temp }}/smoke/windows.txt
            ${{ runner.temp }}/smoke/screen.png
