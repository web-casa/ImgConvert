name: macOS MAS Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag to build, for example v0.2.1.
        required: true
        type: string
      upload_build:
        description: Upload the validated package to App Store Connect.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-mas-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  NODE_VERSION: "24"
  IMGCONVERT_DISABLE_EXTERNAL_CODECS: "1"
  IMGCONVERT_DISABLE_UPDATER: "1"

jobs:
  macos-mas-release:
    name: macOS MAS Release (arm64)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify release tag and source version
        env:
          IMGCONVERT_RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release-tag.mjs --tag="$IMGCONVERT_RELEASE_TAG"

      - name: Require release tag on the default branch
        env:
          IMGCONVERT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test -n "$IMGCONVERT_DEFAULT_BRANCH"
          git fetch --no-tags origin \
            "refs/heads/$IMGCONVERT_DEFAULT_BRANCH:refs/remotes/origin/$IMGCONVERT_DEFAULT_BRANCH"
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$IMGCONVERT_DEFAULT_BRANCH" || {
            echo "release tag must point to a commit on the default branch"
            exit 1
          }

      - name: Verify macOS runner architecture
        run: |
          echo "macOS version: $(sw_vers -productVersion)"
          echo "Runner architecture: $(uname -m)"
          if [ "$(uname -m)" != "arm64" ]; then
            echo "macOS MAS Release expects arm64 runner, got $(uname -m)"
            exit 1
          fi

      - name: Check MAS release secrets
        env:
          APPLE_MAS_CERTIFICATE: ${{ secrets.APPLE_MAS_CERTIFICATE }}
          APPLE_MAS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MAS_CERTIFICATE_PASSWORD }}
          APPLE_MAS_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_MAS_INSTALLER_CERTIFICATE }}
          APPLE_MAS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MAS_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IMGCONVERT_MAS_PROVISION_PROFILE_BASE64: ${{ secrets.IMGCONVERT_MAS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_MAS_CERTIFICATE" || { echo "APPLE_MAS_CERTIFICATE secret is required"; exit 1; }
          test -n "$APPLE_MAS_CERTIFICATE_PASSWORD" || { echo "APPLE_MAS_CERTIFICATE_PASSWORD secret is required"; exit 1; }
          test -n "$APPLE_MAS_INSTALLER_CERTIFICATE" || { echo "APPLE_MAS_INSTALLER_CERTIFICATE secret is required"; exit 1; }
          test -n "$APPLE_MAS_INSTALLER_CERTIFICATE_PASSWORD" || { echo "APPLE_MAS_INSTALLER_CERTIFICATE_PASSWORD secret is required"; exit 1; }
          test -n "$APPLE_ID" || { echo "APPLE_ID secret is required"; exit 1; }
          test -n "$APPLE_PASSWORD" || { echo "APPLE_PASSWORD secret is required"; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo "APPLE_TEAM_ID secret is required"; exit 1; }
          test -n "$IMGCONVERT_MAS_PROVISION_PROFILE_BASE64" || { echo "IMGCONVERT_MAS_PROVISION_PROFILE_BASE64 secret is required"; exit 1; }
          test -n "$KEYCHAIN_PASSWORD" || { echo "KEYCHAIN_PASSWORD secret is required"; exit 1; }

      - name: Install native codec build tools
        run: brew install cmake meson ninja

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.4
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          components: rustfmt, clippy

      - run: pnpm install --frozen-lockfile
      - name: Frontend typecheck
        run: pnpm run typecheck
      - name: macOS Store release guardrails
        run: pnpm run release:macos:store:check
      - name: Tauri backend macOS fmt
        run: cargo +1.96.0 fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Tauri backend macOS clippy
        run: cargo +1.96.0 clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Tauri backend macOS tests
        run: cargo +1.96.0 test --manifest-path src-tauri/Cargo.toml

      - name: Import Apple MAS signing certificates
        env:
          APPLE_MAS_CERTIFICATE: ${{ secrets.APPLE_MAS_CERTIFICATE }}
          APPLE_MAS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MAS_CERTIFICATE_PASSWORD }}
          APPLE_MAS_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_MAS_INSTALLER_CERTIFICATE }}
          APPLE_MAS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MAS_INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          import_certificate() {
            certificate="$1"
            password="$2"
            destination="$3"
            if ! printf '%s' "$certificate" | base64 --decode > "$destination" 2>/dev/null; then
              printf '%s' "$certificate" | base64 -D > "$destination"
            fi
            test -s "$destination" || { echo "decoded certificate is empty"; exit 1; }
            security import "$destination" \
              -k imgconvert-build.keychain \
              -P "$password" \
              -T /usr/bin/codesign \
              -T /usr/bin/productbuild
          }

          security create-keychain -p "$KEYCHAIN_PASSWORD" imgconvert-build.keychain
          security default-keychain -s imgconvert-build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" imgconvert-build.keychain
          security set-keychain-settings -t 3600 -u imgconvert-build.keychain
          import_certificate \
            "$APPLE_MAS_CERTIFICATE" \
            "$APPLE_MAS_CERTIFICATE_PASSWORD" \
            "$RUNNER_TEMP/imgconvert-mas-signing.p12"
          import_certificate \
            "$APPLE_MAS_INSTALLER_CERTIFICATE" \
            "$APPLE_MAS_INSTALLER_CERTIFICATE_PASSWORD" \
            "$RUNNER_TEMP/imgconvert-mas-installer-signing.p12"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            imgconvert-build.keychain
          security find-identity -v -p codesigning imgconvert-build.keychain
          security find-identity -v -p basic imgconvert-build.keychain

      - name: Select MAS signing identities
        env:
          IMGCONVERT_MAS_SIGNING_IDENTITY: ${{ secrets.IMGCONVERT_MAS_SIGNING_IDENTITY }}
          IMGCONVERT_MAS_INSTALLER_IDENTITY: ${{ secrets.IMGCONVERT_MAS_INSTALLER_IDENTITY }}
        run: |
          app_identity="$IMGCONVERT_MAS_SIGNING_IDENTITY"
          if [ -z "$app_identity" ]; then
            app_identity="$(security find-identity -v -p codesigning imgconvert-build.keychain | awk -F'"' '/Apple Distribution|3rd Party Mac Developer Application/ { print $2; exit }')"
          fi
          test -n "$app_identity" || { echo "Apple Distribution signing identity was not found"; exit 1; }

          installer_identity="$IMGCONVERT_MAS_INSTALLER_IDENTITY"
          if [ -z "$installer_identity" ]; then
            installer_identity="$(security find-identity -v -p basic imgconvert-build.keychain | awk -F'"' '/Mac Installer Distribution|3rd Party Mac Developer Installer/ { print $2; exit }')"
          fi
          test -n "$installer_identity" || { echo "Mac Installer Distribution signing identity was not found"; exit 1; }

          case "$app_identity$installer_identity" in
            *$'\n'*|*$'\r'*) echo "signing identity contains a newline"; exit 1 ;;
          esac

          echo "IMGCONVERT_MAS_EFFECTIVE_SIGNING_IDENTITY=$app_identity" >> "$GITHUB_ENV"
          echo "IMGCONVERT_MAS_EFFECTIVE_INSTALLER_IDENTITY=$installer_identity" >> "$GITHUB_ENV"

      - name: Build signed MAS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IMGCONVERT_MAS_PROVISION_PROFILE_BASE64: ${{ secrets.IMGCONVERT_MAS_PROVISION_PROFILE_BASE64 }}
        run: APPLE_SIGNING_IDENTITY="$IMGCONVERT_MAS_EFFECTIVE_SIGNING_IDENTITY" pnpm run release:macos:mas

      - name: Build signed MAS package
        run: IMGCONVERT_MAS_INSTALLER_IDENTITY="$IMGCONVERT_MAS_EFFECTIVE_INSTALLER_IDENTITY" pnpm run release:macos:mas:pkg

      - name: Locate exact MAS package
        id: package
        run: |
          shopt -s nullglob
          packages=(src-tauri/target/release/bundle/pkg/*.pkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "expected exactly one MAS .pkg, found ${#packages[@]}"
            exit 1
          fi
          case "${packages[0]}" in *$'\n'*|*$'\r'*) echo "package path contains a newline"; exit 1 ;; esac
          echo "path=${packages[0]}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: imgconvert-macos-arm64-mas-${{ inputs.tag }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ steps.package.outputs.path }}

      - name: Validate and optionally upload MAS package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
          IMGCONVERT_UPLOAD_BUILD: ${{ inputs.upload_build }}
          IMGCONVERT_MAS_PKG: ${{ steps.package.outputs.path }}
        run: |
          args=(--pkg="$IMGCONVERT_MAS_PKG")
          if [ "$IMGCONVERT_UPLOAD_BUILD" = "true" ]; then
            args+=(--upload)
          fi
          pnpm run release:macos:mas:submit -- "${args[@]}"
