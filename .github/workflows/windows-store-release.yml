name: Windows Store MSIX

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable app release tag to build, for example v0.2.1.
        required: true
        type: string
      store_version:
        description: Four-part Microsoft Store package version.
        required: true
        default: 1.0.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: windows-store-release-${{ inputs.release_tag }}-${{ inputs.store_version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  NODE_VERSION: "24"
  RUSTUP_HOME: C:\rustup
  CARGO_HOME: C:\cargo
  CARGO_TARGET_DIR: C:\imgconvert-target
  CC: cl
  CXX: cl

jobs:
  windows-store:
    name: Windows Store MSIX (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            python_arch: x64
            processor_architecture: AMD64
            msvc_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
            msvc_arch: x64
            msvc_host_arch: x64
            linker_relative_path: bin/Hostx64/x64/link.exe
            rust_linker_env: CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER
          - arch: arm64
            runner: windows-11-arm
            python_arch: arm64
            processor_architecture: ARM64
            msvc_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
            msvc_arch: arm64
            msvc_host_arch: arm64
            linker_relative_path: bin/Hostarm64/arm64/link.exe
            rust_linker_env: CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER
    env:
      WINDOWS_STORE_PROCESSOR_ARCHITECTURE: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify release tag and source version
        shell: pwsh
        env:
          IMGCONVERT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-release-tag.mjs --tag="$env:IMGCONVERT_RELEASE_TAG"

      - name: Verify ARM64-aware Store packaging source
        if: ${{ matrix.arch == 'arm64' }}
        shell: pwsh
        run: |
          $manifestTemplate = Get-Content -Raw packaging/windows/msix/AppxManifest.xml.template
          $prepareScript = Get-Content -Raw scripts/prepare-windows-msix-release.mjs
          if (-not $manifestTemplate.Contains("{{WINDOWS_STORE_PROCESSOR_ARCHITECTURE}}")) {
            throw "The selected release tag predates ARM64-aware MSIX manifest generation"
          }
          if (-not $prepareScript.Contains("WINDOWS_STORE_PROCESSOR_ARCHITECTURE")) {
            throw "The selected release tag predates ARM64-aware MSIX packaging"
          }

      - name: Verify Windows runner architecture
        shell: pwsh
        run: |
          $expected = "${{ matrix.processor_architecture }}"
          if ($env:PROCESSOR_ARCHITECTURE -ne $expected) {
            throw "Windows Store build (${{ matrix.arch }}) expects $expected runner, got $env:PROCESSOR_ARCHITECTURE"
          }

      # libdav1d-sys 0.7.1 passes --prefix=/, which Python 3.13 no longer treats as absolute on Windows.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
          architecture: ${{ matrix.python_arch }}

      - name: Install native codec build tools
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          python -m pip install --disable-pip-version-check meson==1.10.1
          meson --version
          if ("${{ matrix.arch }}" -eq "x64") {
            # libaom 3.11 checks NASM help using a flag that changed in NASM 3.
            $nasmVersion = "2.16.03"
            $nasmArchive = Join-Path $env:RUNNER_TEMP "nasm-$nasmVersion-win64.zip"
            $nasmRoot = Join-Path $env:RUNNER_TEMP "imgconvert-nasm-$nasmVersion"
            Invoke-WebRequest -Uri "https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip" -OutFile $nasmArchive
            $actualHash = (Get-FileHash -Algorithm SHA256 $nasmArchive).Hash.ToLowerInvariant()
            $expectedHash = "3ee4782247bcb874378d02f7eab4e294a84d3d15f3f6ee2de2f47a46aa7226e6"
            if ($actualHash -ne $expectedHash) {
              throw "NASM archive checksum mismatch: expected $expectedHash, got $actualHash"
            }
            New-Item -ItemType Directory -Path $nasmRoot | Out-Null
            Expand-Archive -LiteralPath $nasmArchive -DestinationPath $nasmRoot
            $nasmBin = Join-Path $nasmRoot "nasm-$nasmVersion"
            Add-Content -Path $env:GITHUB_PATH -Value $nasmBin
            $env:Path = "$nasmBin;$env:Path"
            nasm -v
          }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.4
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          components: rustfmt, clippy

      - name: Configure MSVC build environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msvcComponent = "${{ matrix.msvc_component }}"
          $vsPath = & $vswhere -latest -products * -requires $msvcComponent -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio Build Tools with $msvcComponent were not found"
          }
          $vsDevCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) {
            throw "VsDevCmd.bat was not found at $vsDevCmd"
          }
          $envNames = @(
            "DevEnvDir",
            "ExtensionSdkDir",
            "Framework40Version",
            "FrameworkDir",
            "FrameworkDIR64",
            "FrameworkVersion",
            "FrameworkVersion64",
            "INCLUDE",
            "LIB",
            "LIBPATH",
            "Path",
            "UCRTVersion",
            "UniversalCRTSdkDir",
            "VCIDEInstallDir",
            "VCINSTALLDIR",
            "VCToolsInstallDir",
            "VCToolsRedistDir",
            "VCToolsVersion",
            "VisualStudioVersion",
            "VSINSTALLDIR",
            "WindowsLibPath",
            "WindowsSdkBinPath",
            "WindowsSdkDir",
            "WindowsSDKLibVersion",
            "WindowsSDKVersion",
            "WindowsSdkVerBinPath"
          )
          $msvcArch = "${{ matrix.msvc_arch }}"
          $msvcHostArch = "${{ matrix.msvc_host_arch }}"
          cmd /c "`"$vsDevCmd`" -arch=$msvcArch -host_arch=$msvcHostArch && set" | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") {
              $name = $matches[1]
              $value = $matches[2]
              if ($name -and $envNames -contains $name) {
                Set-Item -Path "Env:$name" -Value $value
                if ($name -ieq "Path") {
                  $pathEntries = @()
                  $pathEntries += $value -split ";"
                  $pathEntries += $env:Path -split ";"
                  $seen = @{}
                  $sanitizedPath = $pathEntries |
                    Where-Object {
                      $_ -and
                      (Test-Path $_) -and
                      $_ -notlike "*\WindowsApps" -and
                      $_ -notlike "*\Git\usr\bin" -and
                      $_ -notlike "*\Git\mingw64\bin"
                    } |
                    ForEach-Object {
                      $resolvedPath = [System.IO.Path]::GetFullPath($_).TrimEnd("\")
                      $key = $resolvedPath.ToLowerInvariant()
                      if (-not $seen.ContainsKey($key)) {
                        $seen[$key] = $true
                        $resolvedPath
                      }
                    }
                  $env:Path = ($sanitizedPath -join ";")
                  Add-Content -Path $env:GITHUB_ENV -Value "Path=$env:Path"
                } else {
                  Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
                }
                if ($name -ieq "VCToolsInstallDir") {
                  $linker = Join-Path $value "${{ matrix.linker_relative_path }}"
                  if (-not (Test-Path $linker)) {
                    throw "MSVC linker was not found at $linker"
                  }
                  $linkerEnvironment = "${{ matrix.rust_linker_env }}"
                  Add-Content -Path $env:GITHUB_ENV -Value "$linkerEnvironment=$linker"
                  Set-Item -Path "Env:$linkerEnvironment" -Value $linker
                }
              }
            }
          }
          cl
          Write-Host "Using Rust MSVC linker: $((Get-Item -Path 'Env:${{ matrix.rust_linker_env }}').Value)"

      - name: Select native codec compiler
        shell: pwsh
        run: |
          if ("${{ matrix.arch }}" -eq "arm64") {
            $compilerVersion = & clang-cl --version
            if ($LASTEXITCODE -ne 0) {
              throw "The Windows ARM64 runner does not provide a working clang-cl compiler"
            }
            $compilerVersion | Write-Host
            $nativeTargetLine = $compilerVersion |
              Where-Object { $_ -match "^Target:\s*" } |
              Select-Object -First 1
            $nativeTarget = $nativeTargetLine -replace "^Target:\s*", ""
            if ($nativeTarget -notmatch "^aarch64-.*-windows-msvc$") {
              throw "Expected native Windows ARM64 clang-cl, got target $nativeTarget"
            }
            # clang-cl keeps MSVC-compatible flags while its integrated assembler handles
            # the AArch64 .S files used by rav1e and dav1d.
            $cc = "clang-cl"
            $cxx = "clang-cl"
            # mozjpeg-sys enables the MSVC bit-scan intrinsic without defining the
            # corresponding header probe that upstream CMake normally supplies. Use
            # Clang's -D spelling because other native crates invoke clang directly.
            $arm64CFlags = "-DHAVE_INTRIN_H=1"
            Add-Content -Path $env:GITHUB_ENV -Value "CFLAGS_aarch64_pc_windows_msvc=$arm64CFlags"
          } else {
            $cc = "cl"
            $cxx = "cl"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "CC=$cc"
          Add-Content -Path $env:GITHUB_ENV -Value "CXX=$cxx"
          Set-Item -Path Env:CC -Value $cc
          Set-Item -Path Env:CXX -Value $cxx
          Write-Host "Native codec compiler: CC=$cc CXX=$cxx"

      - run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm run typecheck

      - name: Windows store release guardrails
        env:
          IMGCONVERT_DISABLE_EXTERNAL_CODECS: "1"
          IMGCONVERT_DISABLE_UPDATER: "1"
        run: pnpm run release:windows:store:check

      - name: Tauri backend Windows fmt
        run: cargo +1.96.0 fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Tauri backend Windows clippy
        run: cargo +1.96.0 clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tauri backend Windows tests
        run: cargo +1.96.0 test --manifest-path src-tauri/Cargo.toml

      - name: Build Microsoft Store MSIX submission package
        env:
          IMGCONVERT_DISABLE_EXTERNAL_CODECS: "1"
          IMGCONVERT_DISABLE_UPDATER: "1"
          WINDOWS_STORE_VERSION: ${{ inputs.store_version }}
        run: pnpm run release:windows:msix

      - name: Sideload production MSIX and run conversion smoke
        run: pnpm run release:windows:msix:smoke

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: imgconvert-windows-${{ matrix.arch }}-msix-submission
          if-no-files-found: error
          retention-days: 14
          path: src-tauri/target/windows-msix/*.msix
