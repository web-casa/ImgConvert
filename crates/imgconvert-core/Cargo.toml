[package]
name = "imgconvert-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ImgConvert 的进程内图像编解码核心(纯库,无 UI/IO 框架依赖)"

[dependencies]
# 解码/容器:default-features=false 避免带回 AVIF/ravif/rayon/nasm(Codex 修正)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
# SVG is parsed and rasterized in-process. Keep compressed SVG, raster <image>
# references, and external resource loading out of the product surface.
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
# JPEG 编码(底层 mozjpeg-sys:Unix ARM64 用 gas,x86 用 NASM；Windows ARM64 使用 clang-cl 标量路径)
mozjpeg = "0.10"
# PNG 无损优化(纯 Rust)
oxipng = { version = "9", default-features = false, features = ["parallel"] }
# WebP 编解码(底层 libwebp,cc 构建)
webp = "0.3"
# AVIF:libavif 容器 + rav1e 有损编码 + aom 真无损编码 + dav1d 解码;
# 采 DropWebP 路线,取代裸 ravif,以正确保留 ICC/nclx/alpha。x86 libaom/mozjpeg 需要 nasm。
libavif-sys = { version = "0.17", default-features = false, features = ["codec-rav1e", "codec-aom", "codec-dav1d"] }
# PNG iCCP metadata uses zlib compression; CRCs are needed for PNG chunk surgery.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
# Pixel-level ICC transforms. Static build keeps the desktop app independent from host lcms packages.
lcms2 = { version = "6.1.1", default-features = false, features = ["static"] }
# JPEG Extended XMP uses a 32-byte ASCII MD5 digest id in its marker packet.
md-5 = "0.10"
# 感知质量评分；关闭默认 rayon，避免和文件级并发叠加。
ssimulacra2 = { version = "0.5.1", default-features = false }
# 实验性 PNG 有损限色；MIT，替代 GPL imagequant。
color_quant = "2.0"

[dev-dependencies]
