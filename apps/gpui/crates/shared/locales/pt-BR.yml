diagnostics.license_boundary_body:
  pt-BR: O app principal não inclui codecs HEIC, não vincula a libheif e não distribui o x265. A importação de HEIC passa por auxiliares/provedores opcionais, somente de decodificação, no ambiente do usuário; licença do plug-in, código-fonte/NOTICE e riscos de patente continuam sendo responsabilidade de quem distribui o plug-in. Versões da loja ou Flatpak podem desativar a descoberta de codecs externos para manter limpo o limite do pacote principal. O Windows verifica primeiro as extensões WIC HEIF/HEVC do sistema; se faltarem, siga a dica do diagnóstico para instalar as extensões do sistema ou use um auxiliar separado, sem incluir codecs HEIC.
