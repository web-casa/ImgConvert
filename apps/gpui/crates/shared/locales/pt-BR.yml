  pt-BR: Adicionado antes da extensão. Texto Unicode é aceito; máximo de 48 caracteres e 128 bytes.
settings.output_suffix_adjusted:
  pt-BR: Caracteres de caminho não suportados foram substituídos e o limite seguro de tamanho foi aplicado.
