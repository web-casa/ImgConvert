settings.lossless_label:
  pt-BR: Sem perdas
settings.lossless_description:
  pt-BR: Preferir pixels sem perdas quando o formato de destino permitir; o tamanho da saída pode não ser o mínimo.
settings.skip_larger_label:
  pt-BR: Manter só saídas menores
settings.skip_larger_description:
  pt-BR: Desativado por padrão. Quando ativado, grava um resultado bitmap só se for menor que a origem. Deixe desativado quando o formato exigido importar mais que o tamanho. A rasterização de SVG não é afetada.
settings.multi_candidate_label:
  pt-BR: Testar o menor candidato
settings.multi_candidate_description:
  pt-BR: Testa candidatos de codificação equivalentes e mantém o menor resultado; a conversão pode demorar um pouco mais.
settings.auto_quality_label:
  pt-BR: Qualidade automática
settings.auto_quality_description:
  pt-BR: JPEG/WebP buscam a menor qualidade que atinge a pontuação de destino para minimizar o tamanho.
settings.generation_protection_label:
  pt-BR: Manter só recodificações com perdas vantajosas
settings.generation_protection_description:
  pt-BR: Desativado por padrão. Quando ativado, uma imagem com perdas só é gravada em outro formato com perdas se economizar espaço suficiente. Deixe desativado quando o formato solicitado for obrigatório.
settings.color_section:
  pt-BR: Gerenciamento de cores
settings.convert_to_srgb_label:
  pt-BR: Converter para sRGB
settings.convert_to_srgb_description:
  pt-BR: Usa o perfil ICC incorporado para converter os pixels para sRGB e remove o perfil antigo para uma exibição consistente.
settings.result_cache_label:
  pt-BR: Cache de resultados
settings.result_cache_description:
  pt-BR: Reutiliza saídas existentes quando a origem e as configurações não mudaram; útil para lotes repetidos.
