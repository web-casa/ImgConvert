diagnostics.license_boundary_body:
  es: La aplicación principal no incluye códecs HEIC, no enlaza libheif y no distribuye x265. La importación HEIC se realiza mediante auxiliares/proveedores opcionales de solo decodificación del entorno del usuario; la licencia del complemento, el código fuente/NOTICE y los riesgos de patentes son responsabilidad de quien distribuye el complemento. Las versiones de tienda o Flatpak pueden desactivar la detección de códecs externos para mantener limpio el paquete principal. Windows comprueba primero las extensiones HEIF/HEVC de WIC del sistema; si faltan, sigue la indicación del diagnóstico para instalar las extensiones del sistema o usa un auxiliar independiente sin incluir códecs HEIC.
