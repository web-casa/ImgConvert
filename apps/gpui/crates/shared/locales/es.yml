settings.lossless_label:
  es: Sin pérdida
settings.lossless_description:
  es: Prioriza píxeles sin pérdida cuando el formato de destino lo admite; el tamaño de salida puede no ser el mínimo.
settings.skip_larger_label:
  es: Conservar solo salidas más pequeñas
settings.skip_larger_description:
  es: Desactivado de forma predeterminada. Si se activa, solo se escribe un resultado de mapa de bits cuando es más pequeño que su original. Déjalo desactivado si el formato requerido importa más que el tamaño. No afecta a la rasterización de SVG.
settings.multi_candidate_label:
  es: Probar el candidato más pequeño
settings.multi_candidate_description:
  es: Prueba candidatos de codificación equivalentes y conserva el resultado más pequeño; la conversión puede tardar algo más.
settings.auto_quality_label:
  es: Calidad automática
settings.auto_quality_description:
  es: JPEG/WebP buscan la calidad más baja que alcanza la puntuación objetivo para minimizar el tamaño.
settings.generation_protection_label:
  es: Conservar solo recodificaciones con pérdida que compensen
settings.generation_protection_description:
  es: Desactivado de forma predeterminada. Si se activa, una imagen con pérdida solo se escribe en otro formato con pérdida cuando ahorra suficiente espacio. Déjalo desactivado si el formato solicitado es obligatorio.
settings.color_section:
  es: Gestión del color
settings.convert_to_srgb_label:
  es: Convertir a sRGB
settings.convert_to_srgb_description:
  es: Usa el perfil ICC incrustado para convertir los píxeles a sRGB y elimina el perfil anterior para una visualización uniforme.
settings.result_cache_label:
  es: Caché de resultados
settings.result_cache_description:
  es: Reutiliza las salidas existentes cuando el original y los ajustes no han cambiado; útil para lotes repetidos.
