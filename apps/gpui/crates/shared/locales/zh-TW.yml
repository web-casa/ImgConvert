  zh-TW: 無損壓縮
settings.lossless_description:
  zh-TW: 優先保持像素不失真；僅在目標格式支援時可用，檔案大小不一定最小。
settings.skip_larger_label:
  zh-TW: 僅保留較小的輸出
settings.skip_larger_description:
  zh-TW: 預設關閉。啟用後僅在點陣圖輸出小於來源檔案時寫入；若需要指定格式以相容舊系統（例如 PNG），請保持關閉。SVG 點陣化不受此設定影響。
settings.multi_candidate_label:
  zh-TW: 多候選取最小
settings.multi_candidate_description:
  zh-TW: 嘗試多個等效的編碼候選，並寫入檔案最小的結果，耗時會略為增加。
