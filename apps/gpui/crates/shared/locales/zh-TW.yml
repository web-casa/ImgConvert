  zh-TW: 自動品質
settings.auto_quality_description:
  zh-TW: JPEG/WebP 會搜尋達到目標分數的最低品質，盡量縮小檔案。
settings.generation_protection_label:
  zh-TW: 僅保留有損重新編碼的收益
settings.generation_protection_description:
  zh-TW: 預設關閉。啟用後，有損圖片再次輸出為有損格式時，必須達到足夠的檔案縮減才會寫入；若需要指定格式，請保持關閉。
