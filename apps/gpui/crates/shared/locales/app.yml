  zh-CN: 渲染分辨率（DPI）
workflow.pdf_dpi_hint:
  en: "Applies only to PDF inputs. Range: 72–600 DPI; default: 150."
  zh-CN: 仅对 PDF 输入生效，范围 72–600 DPI，默认 150。
workflow.pdf_dpi_hint_active:
  en: PDF pages are rendered at this DPI first; an enabled batch resize rule is applied afterward.
  zh-CN: 先按 DPI 渲染 PDF；如启用批量尺寸规则，再对渲染结果调整尺寸。
workflow.pdf_range_invalid:
  en: Invalid page range. Use a pattern such as 1-3, 5, 8-10.
  zh-CN: 页面范围格式无效，请使用 1-3, 5, 8-10 这类写法。
workflow.pdf_range_out_of_bounds:
