  zh-CN: 色度抽样
settings.target_score:
  en: Target score
  zh-CN: 目标分
settings.minimum_quality:
  en: Minimum quality
  zh-CN: 最低质量
settings.quality_floor_off:
  en: Off
  zh-CN: 关闭
