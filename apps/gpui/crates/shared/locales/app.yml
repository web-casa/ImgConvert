  zh-CN: 目标文件体积
workflow.target_enable:
  en: Try to stay under a target size
  zh-CN: 尝试不超过指定体积
workflow.target_kib:
  en: Target size (KiB)
  zh-CN: 目标体积（KiB）
workflow.target_summary:
  en: "%{kib} KiB"
  zh-CN: "%{kib} KiB"
workflow.target_hint:
  en: Available for lossy JPEG/WebP. Current quality is the ceiling and minimum quality is respected.
  zh-CN: 仅支持有损 JPEG/WebP；以当前质量作为上限，并遵守最低质量。
workflow.target_unsupported:
  en: Choose lossy JPEG or WebP before enabling target size.
  zh-CN: 请选择有损 JPEG 或 WebP 后启用目标体积。
workflow.metadata_section:
  en: Privacy metadata
  zh-CN: 隐私元数据
workflow.metadata_policy:
  en: Retention policy
  zh-CN: 保留策略
workflow.metadata.strip_all:
  en: Remove all metadata
  zh-CN: 移除全部元数据
workflow.metadata.strip_all_description:
  en: Convert profiled pixels to sRGB, then remove ICC, EXIF, XMP, and IPTC for public sharing.
  zh-CN: 先将带配置的像素转为 sRGB，再移除 ICC、EXIF、XMP 与 IPTC。
workflow.metadata.color_only:
  en: Keep color profile only
  zh-CN: 仅保留色彩配置
workflow.metadata.color_only_description:
  en: Keep the complete ICC profile for color rendering; profile or device identifiers may remain.
  zh-CN: 保留完整 ICC 以维持色彩；其中仍可能包含配置或设备标识。
workflow.metadata.preserve_all:
  en: Keep all supported metadata
  zh-CN: 保留全部支持项
workflow.metadata.preserve_all_description:
  en: Preserve ICC, EXIF, XMP, and IPTC where supported.
  zh-CN: 尽量保留 ICC、EXIF、XMP 与 IPTC。
workflow.invalid_configuration:
  en: Fix the highlighted settings before starting
  zh-CN: 开始前请先修正标红的设置
