  en: Refresh preview
  zh-CN: 刷新预览
preview.stale:
  en: Conversion settings changed. Refresh to update the converted preview.
  zh-CN: 转换设置已更改，请刷新以更新转换后预览。
preview.close:
  en: Close
  zh-CN: 关闭
preview.reveal:
  en: Drag to compare before and after
  zh-CN: 拖动查看转换前后
preview.dimensions:
  en: "%{width} × %{height}"
  zh-CN: "%{width} × %{height}"
preview.output_size:
  en: "Estimated output %{size}"
  zh-CN: "预计输出 %{size}"
preview.quality:
  en: "Selected quality %{quality}"
  zh-CN: "实际质量 %{quality}"
preview.target_met:
  en: Target size reached
  zh-CN: 已达到目标体积
preview.target_not_met:
  en: The target cannot be reached within the minimum-quality limit
  zh-CN: 在最低质量限制内无法达到目标体积
preview.error:
  en: "Couldn’t generate the comparison preview: %{detail}"
  zh-CN: "无法生成对比预览：%{detail}"
preview.cancelled:
  en: Preview cancelled
  zh-CN: 预览已取消
warning.output_backup_retained:
  en: "Converted, but the previous output backup remains: %{path}"
  zh-CN: "转换完成，但原输出备份仍保留在：%{path}"
warning.modified_time_not_preserved:
  en: "Converted, but the modified time could not be preserved: %{path}"
  zh-CN: "转换完成，但未能保留修改时间：%{path}"
warning.color_profile_converted_for_resize:
  en: Pixels were converted to sRGB before resizing, and the now-invalid source ICC profile was removed.
  zh-CN: 调整尺寸前已将像素转换为 sRGB，并移除不再匹配的原 ICC 配置。
warning.invalid_color_profile_discarded:
  en: The embedded ICC profile was invalid and was removed by the privacy policy. Pixels use their decoded values, so colours may differ from the source application.
  zh-CN: 嵌入的 ICC 配置无效；已按隐私设置移除，像素按原始解码值输出，颜色可能与源应用不同。
warning.invalid_color_profile_ignored_for_preview:
  en: The embedded ICC profile is invalid. It remains in the converted file as requested, but this display preview uses the decoded pixel values without that profile.
  zh-CN: 嵌入的 ICC 配置无效。转换文件会按设置继续保留该配置，但当前显示预览使用不含该配置的已解码像素。
warning.target_size_not_met:
  en: "Target %{target}; the smallest usable candidate was %{actual}, which could not reach the target within the minimum-quality limit."
  zh-CN: "目标为 %{target}；已输出 %{actual} 的最小候选，但在最低质量限制内仍未达到目标。"
warning.pdf_pages_skipped_existing:
  en: "Kept %{count} existing page output(s)."
  zh-CN: "已保留 %{count} 个已存在的页面文件。"
warning.pdf_render_warnings:
  en: "PDF page %{page} produced %{count} compatibility warning(s); some content may be missing."
  zh-CN: "PDF 第 %{page} 页渲染时出现 %{count} 个兼容性警告，结果可能缺少部分内容。"
safety.queued_input_conflict_title:
  en: Queued source overwrite prevented
  zh-CN: 已阻止覆盖队列中的原图
safety.queued_input_conflict_message:
  en: "%{count} output path(s) match another queued input. To protect sources, those items will not be written; the remaining items can continue."
  zh-CN: "有 %{count} 个输出路径与队列中的其他输入文件相同。为保护原图，这些项目不会写入；其余项目可以继续转换。"
safety.continue_remaining:
  en: Continue remaining items
  zh-CN: 继续其余项目
safety.continue_conversion:
  en: Continue conversion
  zh-CN: 继续转换
safety.source_overwrite_title:
  en: Source file may be replaced
  zh-CN: 可能覆盖原图
safety.source_overwrite:
  en: Replace source file
  zh-CN: 确认覆盖原图
safety.source_overwrite_message:
  en: "%{count} output file(s) are the same file as their source. Continuing will replace the original and cannot be undone."
  zh-CN: "有 %{count} 个输出文件与原图是同一个文件。继续后将替换原图，且无法撤销。"
safety.source_overwrite_single_message:
  en: "This output is the same file as its source: %{path}. Confirming will replace the original and cannot be undone."
  zh-CN: "此输出与原图是同一个文件：%{path}。确认后将替换原图，且无法撤销。"
safety.source_overwrite_will_skip_message:
  en: "%{count} output file(s) match their source. With “Skip” selected, those originals will not be changed."
  zh-CN: "有 %{count} 个输出文件与原图同名。当前设为“跳过”，这些原图不会被修改。"
safety.confirm_overwrite_title:
  en: Confirm overwrite
  zh-CN: 确认覆盖
safety.output_exists:
  en: "Output file already exists: %{path}"
  zh-CN: "输出文件已存在：%{path}"
safety.pdf_outputs_exist:
  en: "This PDF has %{count} existing page outputs. Overwrite those files?"
  zh-CN: "此 PDF 有 %{count} 个页面输出已存在。是否覆盖这些文件？"
safety.overwrite:
