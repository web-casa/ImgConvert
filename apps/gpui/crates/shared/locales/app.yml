diagnostics.license_boundary_title:
  en: License and channel boundaries
  zh-CN: 许可与渠道边界
diagnostics.license_boundary_body:
  en: The main app does not bundle HEIC codecs, does not link libheif, and does not distribute x265. HEIC import goes through optional decode-only helpers/providers in the user environment; plugin license, source/NOTICE, and patent risks remain the plugin distributor's responsibility. Store or Flatpak builds can disable external codec discovery to keep the main package boundary clean. Windows first probes the system WIC HEIF/HEVC extensions; when missing, follow the diagnostic hint to install system extensions or use a separate helper without bundling HEIC codecs.
  zh-CN: 主程序不内置 HEIC 编解码器，不链接 libheif，不分发 x265。HEIC 仅通过用户环境中的可选 decode-only 辅助程序/提供方 导入；插件许可、源码/NOTICE 与专利风险需由插件分发方单独处理。商店或 Flatpak 构建可通过禁用外部编解码器 自动发现保持主包边界。Windows 优先探测系统 WIC HEIF/HEVC 扩展；缺失时可按诊断提示安装系统扩展，或使用单独的辅助程序，不把 HEIC 编解码器 打进主程序。
