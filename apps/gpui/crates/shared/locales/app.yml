  zh-CN: 允许放大较小图片
workflow.compression_policy_disabled:
  en: “Keep smaller outputs only” and “Keep beneficial lossy re-encodes only” do not apply when resizing.
  zh-CN: 调整尺寸时，“仅保留更小输出”和“仅保留有损重编码收益”不适用。
workflow.target_section:
