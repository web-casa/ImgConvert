  en: Add suffix
  zh-CN: 添加后缀
settings.output_suffix_hint:
  en: Added before the extension. Unicode text is supported; maximum 48 characters and 128 bytes.
  zh-CN: 会在扩展名之前添加；支持自定义 Unicode 文本，最长 48 个字符且不超过 128 字节。
settings.output_suffix_adjusted:
  en: Unsupported path characters were replaced and the safe length limit was applied.
  zh-CN: 已替换不支持的路径字符，并按安全长度限制保存。
settings.output_suffix_required:
  en: Enter at least one character, or turn this switch off to omit the suffix.
  zh-CN: 要使用后缀，请至少输入一个字符；不需要后缀可关闭此开关。
settings.suffix_disabled_collision_hint:
  en: With no suffix and the same target format, an output can match its source. Existing files follow the “Existing files” choice.
  zh-CN: 关闭后缀且目标格式相同可能与原图同名；已存在文件按“已存在文件”的选择处理。
settings.file_name_template:
  en: File name template
  zh-CN: 文件名模板
settings.file_name_template_hint:
  en: Used when “Add suffix” is off. Supports %name%, %extension%, and %date%.
  zh-CN: 关闭“添加后缀”后使用。支持 %name%、%extension%、%date%。
settings.compression_section:
  en: Compression policies
  zh-CN: 压缩策略
settings.enabled_count:
  en: "%{count} enabled"
  zh-CN: "已启用 %{count} 项"
settings.enabled:
  en: Enabled
  zh-CN: 已开启
settings.disabled:
  en: Disabled
  zh-CN: 未开启
settings.lossless_label:
  en: Lossless
  zh-CN: 无损压缩
settings.lossless_description:
  en: Prefer lossless pixels when the target format supports it; output size may not be minimal.
  zh-CN: 优先保持像素不损失；仅在目标格式支持时可用，文件体积不一定最小。
settings.skip_larger_label:
  en: Keep smaller outputs only
  zh-CN: 仅保留更小的输出
settings.skip_larger_description:
  en: Off by default. When enabled, write a bitmap result only when it is smaller than its source. Leave it off when a required format matters more than size. SVG rasterization is unaffected.
  zh-CN: 默认关闭。启用后仅在位图输出小于源文件时写入；若需要指定格式兼容旧系统（例如 PNG），请保持关闭。SVG 栅格化不受此设置影响。
settings.multi_candidate_label:
  en: Try smallest candidate
  zh-CN: 多候选取最小
settings.multi_candidate_description:
  en: Try equivalent encoding candidates and keep the smallest result; conversion may take slightly longer.
  zh-CN: 尝试多个等价编码候选，并写入体积最小的结果，耗时会略有增加。
settings.auto_quality_label:
  en: Auto quality
  zh-CN: 自动质量
settings.auto_quality_description:
  en: JPEG/WebP search for the lowest quality that reaches the target score to minimize size.
  zh-CN: JPEG/WebP 会搜索达到目标评分的最低质量，尽量减少体积。
settings.generation_protection_label:
  en: Keep beneficial lossy re-encodes only
  zh-CN: 仅保留有损重编码收益
settings.generation_protection_description:
  en: Off by default. When enabled, a lossy image is written to another lossy format only when it saves enough space. Leave it off when the requested format is required.
  zh-CN: 默认关闭。启用后，有损图片再次输出有损格式时必须达到足够体积收益才写入；若需要指定格式，请保持关闭。
settings.color_section:
  en: Color management
  zh-CN: 色彩管理
settings.convert_to_srgb_label:
  en: Convert to sRGB
  zh-CN: 转为 sRGB
settings.convert_to_srgb_description:
  en: Use the embedded ICC profile to convert pixels to sRGB and remove the old profile for consistent display.
  zh-CN: 使用嵌入 ICC 转换像素到 sRGB，并移除旧 ICC，适合统一网页和通用查看器显示。
settings.result_cache_label:
  en: Result cache
  zh-CN: 结果缓存
settings.result_cache_description:
  en: Reuse existing outputs when the source and settings are unchanged; useful for repeat batches.
  zh-CN: 源文件与设置未变时复用已有输出，适合重复处理同一批文件。
settings.clear_result_cache:
