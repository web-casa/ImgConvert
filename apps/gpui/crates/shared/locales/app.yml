  en: Page range (leave empty for all)
  zh-CN: 页面范围（留空表示全部）
workflow.pdf_pages_placeholder:
  en: "For example: 1-3, 5, 8-10"
  zh-CN: "例如 1-3, 5, 8-10"
workflow.pdf_pages_hint:
  en: Pages start at 1. Combine pages and ranges; up to 500 pages per job.
  zh-CN: 页码从 1 开始；可组合单页和范围，一次最多 500 页。
workflow.pdf_dpi:
  en: Render resolution (DPI)
  zh-CN: 渲染分辨率（DPI）
workflow.pdf_dpi_hint:
  en: "Applies only to PDF inputs. Range: 72–600 DPI; default: 150."
  zh-CN: 仅对 PDF 输入生效，范围 72–600 DPI，默认 150。
workflow.pdf_dpi_hint_active:
  en: PDF pages are rendered at this DPI first; an enabled batch resize rule is applied afterward.
  zh-CN: 先按 DPI 渲染 PDF；如启用批量尺寸规则，再对渲染结果调整尺寸。
workflow.pdf_range_invalid:
  en: Invalid page range. Use a pattern such as 1-3, 5, 8-10.
  zh-CN: 页面范围格式无效，请使用 1-3, 5, 8-10 这类写法。
workflow.pdf_range_out_of_bounds:
  en: "The page range exceeds this document's %{count} pages."
  zh-CN: "页面范围超出文档总页数（%{count} 页）。"
workflow.pdf_range_required:
  en: "This document is large. Select pages explicitly; up to %{count} at a time."
  zh-CN: "文档页数较多，请明确选择页面；一次最多 %{count} 页。"
workflow.pdf_range_too_long:
  en: The page range is too long.
  zh-CN: 页面范围输入过长。
workflow.pdf_too_many_pages:
