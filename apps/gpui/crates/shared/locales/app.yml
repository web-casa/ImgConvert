workflow.presets.web_sharing:
  en: Web sharing
  zh-CN: 网页分享
workflow.presets.web_sharing_description:
  en: WebP, 2048 px longest edge, with color metadata only.
  zh-CN: WebP、最长边 2048 px，仅保留色彩配置。
workflow.presets.email:
  en: Email attachment
  zh-CN: 邮件附件
workflow.presets.email_description:
  en: JPEG, 1600 px longest edge, targeting 1 MiB.
  zh-CN: JPEG、最长边 1600 px，目标 1 MiB。
workflow.presets.high_quality:
  en: High-quality archive
  zh-CN: 高质量归档
workflow.presets.high_quality_description:
  en: High-quality AVIF with all supported metadata preserved.
  zh-CN: 高质量 AVIF，保留全部支持的元数据。
workflow.presets.private_sharing:
  en: Private sharing
  zh-CN: 隐私分享
workflow.presets.private_sharing_description:
  en: JPEG, 2048 px longest edge, with all metadata removed.
  zh-CN: JPEG、最长边 2048 px，并移除全部元数据。
