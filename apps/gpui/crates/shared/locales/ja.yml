  ja: 効果のある非可逆再エンコードのみ保存
settings.generation_protection_description:
  ja: デフォルトはオフです。オンにすると、非可逆画像を別の非可逆形式に変換するのは十分に容量を節約できる場合のみになります。指定形式が必須の場合はオフのままにしてください。
