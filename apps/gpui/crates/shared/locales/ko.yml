  ko: 기본 앱은 HEIC 코덱을 번들로 포함하지 않고, libheif를 링크하지 않으며, x265를 배포하지 않습니다. HEIC 가져오기는 사용자 환경의 선택적 디코딩 전용 도우미/제공자를 통해 이루어지며, 플러그인 라이선스, 소스/NOTICE, 특허 위험은 플러그인 배포자의 책임입니다. 스토어 또는 Flatpak 빌드는 외부 코덱 검색을 비활성화하여 기본 패키지 경계를 깔끔하게 유지할 수 있습니다. Windows는 먼저 시스템 WIC HEIF/HEVC 확장을 검사하며, 없으면 진단 안내에 따라 시스템 확장을 설치하거나 HEIC 코덱을 번들로 포함하지 않는 별도 도우미를 사용하세요.
