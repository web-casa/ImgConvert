settings.generation_protection_description:
  de: Standardmäßig aus. Wenn aktiviert, wird ein verlustbehaftetes Bild nur dann in ein anderes verlustbehaftetes Format geschrieben, wenn genug Platz gespart wird. Lass es aus, wenn das gewählte Format erforderlich ist.
