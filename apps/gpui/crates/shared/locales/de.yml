  de: Die Haupt-App enthält keine HEIC-Codecs, linkt nicht gegen libheif und vertreibt kein x265. Der HEIC-Import erfolgt über optionale, nur dekodierende Helfer/Anbieter in der Umgebung des Benutzers; Plug-in-Lizenz, Quellcode/NOTICE und Patentrisiken liegen in der Verantwortung des Plug-in-Anbieters. Store- oder Flatpak-Builds können die Erkennung externer Codecs deaktivieren, um das Hauptpaket sauber abzugrenzen. Windows prüft zuerst die System-WIC-Erweiterungen für HEIF/HEVC; fehlen sie, folge dem Diagnosehinweis, um Systemerweiterungen zu installieren oder einen separaten Helfer zu verwenden, ohne HEIC-Codecs zu bündeln.
