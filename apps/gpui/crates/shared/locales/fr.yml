  fr: Méthode et sources (disponibles hors ligne)
impact.formula:
  fr: "Modèle v1.0.0 : capacité (TB) × heures de conservation × 0,65–1,2 Wh/TB·h × PUE 1,1–1,185 × copies = énergie (Wh). Énergie ÷ 1000 × 473 g CO₂/kWh = grammes de CO₂. L’intensité du réseau est la moyenne mondiale 2024 ; ces facteurs historiques ne décrivent ni un fournisseur actuel ni un appareil local."
impact.privacy:
  fr: Exclut l’énergie de conversion, les réseaux, la fabrication et la fin de vie du matériel ainsi que les effets rebond. Les paramètres restent en mémoire dans le panneau, sont réinitialisés à la fermeture et ne sont ni enregistrés ni envoyés. Les tailles de fichier utilisent des KB/MB binaires ; le modèle utilise des TB décimaux.
