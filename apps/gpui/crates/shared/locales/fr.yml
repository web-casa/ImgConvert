diagnostics.license_boundary_body:
  fr: L’application principale n’intègre aucun codec HEIC, ne se lie pas à libheif et ne distribue pas x265. L’import HEIC passe par des assistants/fournisseurs facultatifs, en décodage seul, présents dans l’environnement de l’utilisateur ; la licence du plug-in, les sources/NOTICE et les risques liés aux brevets relèvent de son distributeur. Les versions Store ou Flatpak peuvent désactiver la découverte de codecs externes pour préserver les limites du paquet principal. Windows sonde d’abord les extensions système WIC HEIF/HEVC ; si elles manquent, suivez l’indication du diagnostic pour installer les extensions système ou utilisez un assistant séparé, sans intégrer de codec HEIC.
