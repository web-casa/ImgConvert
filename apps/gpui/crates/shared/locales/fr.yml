  fr: Ajouter un suffixe
settings.output_suffix_hint:
  fr: Ajouté avant l’extension. Texte Unicode accepté ; 48 caractères et 128 octets au maximum.
settings.output_suffix_adjusted:
  fr: Les caractères de chemin non pris en charge ont été remplacés et la limite de longueur sûre a été appliquée.
settings.output_suffix_required:
  fr: Saisissez au moins un caractère, ou désactivez cette option pour omettre le suffixe.
settings.suffix_disabled_collision_hint:
  fr: Sans suffixe et avec le même format cible, une sortie peut porter le même nom que sa source. Les fichiers existants suivent le choix « Fichiers existants ».
settings.file_name_template:
  fr: Modèle de nom de fichier
settings.file_name_template_hint:
  fr: Utilisé quand « Ajouter un suffixe » est désactivé. Prend en charge %name%, %extension% et %date%.
settings.compression_section:
  fr: Stratégies de compression
settings.lossless_label:
  fr: Sans perte
settings.lossless_description:
  fr: Privilégie des pixels sans perte quand le format cible le permet ; la taille obtenue n’est pas forcément minimale.
settings.skip_larger_label:
  fr: Ne garder que les sorties plus petites
settings.skip_larger_description:
  fr: Désactivé par défaut. Une fois activé, un résultat bitmap n’est écrit que s’il est plus petit que sa source. Laissez-le désactivé si le format compte plus que la taille. La rastérisation SVG n’est pas concernée.
settings.multi_candidate_label:
  fr: Essayer le plus petit candidat
settings.multi_candidate_description:
  fr: Essaie plusieurs encodages équivalents et garde le plus petit résultat ; la conversion peut être un peu plus longue.
settings.auto_quality_label:
  fr: Qualité auto
settings.auto_quality_description:
  fr: JPEG/WebP cherchent la qualité la plus basse qui atteint le score cible afin de réduire la taille.
settings.generation_protection_label:
  fr: Ne réencoder avec perte que si c’est utile
settings.generation_protection_description:
  fr: Désactivé par défaut. Une fois activé, une image avec perte n’est écrite dans un autre format avec perte que si le gain de place est suffisant. Laissez-le désactivé si le format demandé est requis.
settings.color_section:
  fr: Gestion des couleurs
settings.convert_to_srgb_label:
  fr: Convertir en sRGB
settings.convert_to_srgb_description:
  fr: Utilise le profil ICC intégré pour convertir les pixels en sRGB et supprime l’ancien profil pour un affichage homogène.
settings.result_cache_label:
  fr: Cache des résultats
settings.result_cache_description:
  fr: Réutilise les sorties existantes si la source et les réglages n’ont pas changé ; utile pour les lots répétés.
settings.clear_result_cache:
  fr: Vider le cache des résultats
