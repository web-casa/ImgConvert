[package]
name = "imgconvert-gpui-app-settings"
description = "Application settings and update workflow for the GPUI shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
updater = ["dep:cargo-packager-updater", "dep:base64", "dep:minisign-verify", "dep:tempfile", "imgconvert-platform/update-guard"]

[dependencies]
gpui-kit.workspace = true
imgconvert-gpui-shared.workspace = true
imgconvert-platform.workspace = true
serde_json.workspace = true
futures = "0.3"
cargo-packager-updater = { version = "=0.2.3", optional = true }
base64 = { version = "0.22", optional = true }
minisign-verify = { version = "0.2.5", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
