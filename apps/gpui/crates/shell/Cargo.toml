[package]
name = "imgconvert-gpui"
description = "ImgConvert desktop shell on GPUI Kit: window, menus, quit, locale switch and the perf-probe driver. Composes the feature crates and holds no feature logic."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "imgconvert-gpui"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
gpui-kit.workspace = true
imgconvert-backend.workspace = true
imgconvert-gpui-shared.workspace = true
imgconvert-gpui-queue.workspace = true
imgconvert-gpui-workflow.workspace = true
anyhow.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
