          <h1>ImgConvert：本地图片转换、批量压缩与格式转换</h1>
          <p>
            ImgConvert 是一款本地优先的跨平台桌面图片转换工具，用于批量转换、压缩和整理
            JPEG、PNG、WebP、AVIF 等图片。原图不上传，处理在你的设备上完成。
          </p>
          <h2>本地处理，而不是网页上传</h2>
          <p>
            图片转换、压缩、缩略图生成和队列管理均在本机完成。应用不包含账号系统、广告 SDK、行为统计
            SDK 或第三方埋点。
          </p>
          <h2>格式与批量工作流</h2>
          <p>
            可将文件、目录和你主动粘贴的剪贴板图片集中到同一个任务队列；单张图片可单独选择输出格式。支持
            AVIF、WebP、JPEG 和 PNG 输出；HEIC 是平台能力支持的只读导入。
          </p>
          <h2>常见问题</h2>
