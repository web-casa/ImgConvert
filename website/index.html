          <h1>ImgConvert：本地图片转换、批量压缩与格式转换</h1>
          <p>
            ImgConvert 提供跨平台桌面应用和浏览器内本地处理的 Web 版，用于转换、压缩和整理
            PDF、SVG、HEIC、JPEG、PNG、WebP、AVIF 等文件。具体格式能力因版本而异；原图不上传。
          </p>
          <h2>设备内处理，而不是上传转换</h2>
          <p>
            桌面版在本机处理，Web 版在浏览器 Worker 中处理。产品不包含账号系统、广告 SDK、行为统计
            SDK 或第三方埋点，也不把原图发送到转换服务器。
          </p>
          <h2>格式与批量工作流</h2>
          <p>
            可将文件、目录和你主动粘贴的剪贴板图片集中到同一个任务队列；单张图片可单独选择输出格式。支持
            AVIF、WebP、JPEG 和 PNG 输出；PDF、SVG、HEIC 及常见图片格式均可作为输入。
          </p>
          <h2>常见问题</h2>
          <p>图片不会被上传到服务器。更多数据处理、缓存与元数据说明请阅读隐私政策。</p>
