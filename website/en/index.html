          <h1>ImgConvert: local image conversion, batch compression, and format conversion</h1>
          <p>
            ImgConvert offers cross-platform desktop apps and an in-browser local Web app for
            converting and compressing PDF, SVG, HEIC, JPEG, PNG, WebP, and AVIF files. Exact format
            support differs by edition; originals stay on your device.
          </p>
          <h2>On-device processing, not conversion upload</h2>
          <p>
            Desktop runs locally and Web runs in browser workers. Neither sends originals to a
            conversion server. The product contains no account system, ad SDK, behavioral analytics
            SDK, or third-party tracking.
          </p>
          <h2>Formats and batch workflow</h2>
          <p>
            Bring files, folders, and clipboard images you intentionally paste into one queue, then
            choose an output format per image. AVIF, WebP, JPEG, and PNG are output formats; PDF,
            SVG, HEIC, and common image formats are accepted as input.
          </p>
          <h2>Common questions</h2>
          <p>
            Images are not uploaded to a server. Read the privacy policy for the full explanation of
            data handling, caches, and metadata.
          </p>
