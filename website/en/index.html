          <h1>ImgConvert: local image conversion, batch compression, and format conversion</h1>
          <p>
            ImgConvert is a local-first, cross-platform desktop image converter for batch
            conversion, compression, and organization of JPEG, PNG, WebP, and AVIF images. Your
            originals stay on your device.
          </p>
          <h2>Local processing, not web upload</h2>
          <p>
            Image conversion, compression, thumbnail generation, and queue management run on your
            device. The app contains no account system, ad SDK, behavioral analytics SDK, or
            third-party tracking.
          </p>
          <h2>Formats and batch workflow</h2>
          <p>
            Bring files, folders, and clipboard images you intentionally paste into one queue, then
            choose an output format per image. AVIF, WebP, JPEG, and PNG are output formats; HEIC is
            a platform-capability read-only import.
          </p>
          <h2>Common questions</h2>
          <p>
            Images are not uploaded to a server. Read the privacy policy for the full explanation of
            data handling, caches, and metadata.
