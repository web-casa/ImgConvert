# SPDX-License-Identifier: Apache-2.0

name: imgconvert
version: "0.2.7"
summary: Local-first batch image converter
description: |
  Convert JPEG, PNG, WebP, and AVIF images in batches without uploading
  files. ImgConvert processes selected images locally and writes results only
  to a destination chosen by the user.
license: Apache-2.0
website: https://github.com/web-casa/ImgConvert
source-code: https://github.com/web-casa/ImgConvert
issues: https://github.com/web-casa/ImgConvert/issues
contact: https://github.com/web-casa/ImgConvert/issues
icon: src-tauri/icons/128x128@2x.png

base: core24
grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:
  arm64:

apps:
  imgconvert:
    command: usr/bin/imgconvert
    extensions:
      - gnome
    plugs:
      - home
      - removable-media

parts:
  imgconvert:
    # The GNOME extension's build environment conflicts with the Rustup snap's
    # host-linked libc. Keep this a custom lifecycle so LD_LIBRARY_PATH can be
    # sanitized before Rustup or Cargo starts.
    plugin: nil
    source: .
    build-snaps:
      - rustup/latest/stable
      - node/24/stable
    build-packages:
      - build-essential
      - cmake
      - meson
      - nasm
      - ninja-build
      - pkg-config
      - libgtk-3-dev
      - libwebkit2gtk-4.1-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
    override-build: |
      set -eu
      # GNOME's SDK injects its libc through LD_LIBRARY_PATH. Build tools from
      # the Node and Rust snaps must use the managed core24 instance's libc.
      unset LD_LIBRARY_PATH
      rustup toolchain install 1.96.0 --profile minimal
      npm install --global --prefix "$CRAFT_PART_BUILD/.pnpm" pnpm@10.34.4
      export PATH="$CRAFT_PART_BUILD/.pnpm/bin:$PATH"
      pnpm install --frozen-lockfile
      export IMGCONVERT_DISABLE_EXTERNAL_CODECS=1
      export IMGCONVERT_DISABLE_UPDATER=1
      pnpm run build
      cargo +1.96.0 build --release --locked \
        --features tauri/custom-protocol \
        --manifest-path src-tauri/Cargo.toml

      install -Dm755 src-tauri/target/release/imgconvert \
        "$CRAFT_PART_INSTALL/usr/bin/imgconvert"
      install -Dm644 packaging/appimagehub/com.ivmm.imgconvert.metainfo.xml \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/com.ivmm.imgconvert.metainfo.xml"
      install -Dm644 src-tauri/icons/128x128@2x.png \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/imgconvert.png"
      install -Dm644 LICENSE \
        "$CRAFT_PART_INSTALL/usr/share/licenses/imgconvert/LICENSE"
      install -Dm644 NOTICE \
        "$CRAFT_PART_INSTALL/usr/share/doc/imgconvert/NOTICE"
      install -Dm644 THIRD_PARTY_LICENSES.md \
        "$CRAFT_PART_INSTALL/usr/share/doc/imgconvert/THIRD_PARTY_LICENSES.md"
